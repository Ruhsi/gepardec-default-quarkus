      - name: Ensure dependency JAR classpaths for source impact
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pr-change
        run: |
          set -euo pipefail
          export LC_ALL=C

          relevant_change_count="$({
            OUTPUT_DIR="${OUTPUT_DIR}" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          changes = json.loads(
              (Path(os.environ["OUTPUT_DIR"]) / "dependency-changes.json").read_text(
                  encoding="utf-8"
              )
          )
          print(
              sum(
                  1
                  for change in changes.get("changes", [])
                  if change.get("type", "jar") == "jar"
                  and change.get("changeType") in {"REMOVED", "ADDED"}
              )
          )
          PY
          })"

          if [[ "${relevant_change_count}" == "0" ]]; then
            exit 0
          fi

          resolved_root="${RUNNER_TEMP}/resolved-jars"
          mkdir -p -- "${resolved_root}/base" "${resolved_root}/head"

          resolve_if_missing() {
            local label="$1"
            local project_dir="$2"
            local destination="$3"

            if find "${destination}" -type f -name '*.jar' -print -quit 2>/dev/null | grep -q .; then
              echo "${label} dependency JAR classpath already resolved."
              return 0
            fi

            local -a mvn_command
            if [[ -f "${project_dir}/mvnw" ]]; then
              chmod +x "${project_dir}/mvnw"
              mvn_command=("./mvnw")
            else
              mvn_command=("mvn")
            fi

            echo "::group::Resolve ${label} JAR files for source-impact analysis"
            (
              cd "${project_dir}"
              "${mvn_command[@]}" \
                -B \
                -ntp \
                -Dstyle.color=never \
                -DskipTests \
                "org.apache.maven.plugins:maven-dependency-plugin:${MAVEN_DEPENDENCY_PLUGIN_VERSION}:copy-dependencies" \
                "-DoutputDirectory=${destination}" \
                -DincludeTypes=jar \
                -DincludeScope=test \
                -Dmdep.useRepositoryLayout=true \
                -Dmdep.useBaseVersion=true \
                -Dmdep.stripVersion=false \
                -Dmdep.stripClassifier=false
            )
            echo "::endgroup::"
          }

          resolve_if_missing \
            "base" \
            "${RUNNER_TEMP}/dependency-base" \
            "${resolved_root}/base"

          resolve_if_missing \
            "head" \
            "${RUNNER_TEMP}/dependency-head" \
            "${resolved_root}/head"

      - name: Create complete Java source-usage plan
        id: usage-plan
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pr-change
          SOURCE_ROOT: ${{ runner.temp }}/dependency-head
          RESOLVED_BASE: ${{ runner.temp }}/resolved-jars/base
          RESOLVED_HEAD: ${{ runner.temp }}/resolved-jars/head
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          OUTPUT_DIR="${OUTPUT_DIR}" \
          SOURCE_ROOT="${SOURCE_ROOT}" \
          RESOLVED_BASE="${RESOLVED_BASE}" \
          RESOLVED_HEAD="${RESOLVED_HEAD}" \
          MAX_JAVA_SOURCE_FILES="${MAX_JAVA_SOURCE_FILES}" \
          MAX_REMOVED_DEPENDENCY_TYPE_TARGETS="${MAX_REMOVED_DEPENDENCY_TYPE_TARGETS}" \
          HEAD_SHA="${HEAD_SHA}" \
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import zipfile
          from collections import Counter
          from pathlib import Path

          output_dir = Path(os.environ["OUTPUT_DIR"])
          source_root = Path(os.environ["SOURCE_ROOT"]).resolve()
          resolved_base = Path(os.environ["RESOLVED_BASE"]).resolve()
          resolved_head = Path(os.environ["RESOLVED_HEAD"]).resolve()
          max_source_files = int(os.environ["MAX_JAVA_SOURCE_FILES"])
          max_removed_targets = int(os.environ["MAX_REMOVED_DEPENDENCY_TYPE_TARGETS"])
          list_separator = "\x1f"
          production_scopes = {"compile", "runtime", "provided", "system"}


          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()


          def encode(value):
              raw = str(value).encode("utf-8")
              return base64.urlsafe_b64encode(raw).decode("ascii").rstrip("=")


          def source_set(path):
              normalized = f"/{path.as_posix()}/"
              if "/src/main/java/" in normalized:
                  return "MAIN"
              if "/src/test/java/" in normalized:
                  return "TEST"
              if any(
                  marker in normalized
                  for marker in (
                      "/src/integration-test/java/",
                      "/src/integrationTest/java/",
                      "/src/it/java/",
                  )
              ):
                  return "INTEGRATION_TEST"
              if "/src/testFixtures/java/" in normalized:
                  return "TEST_FIXTURE"
              return "OTHER"


          def module_path(path):
              value = path.as_posix()
              marker = value.find("/src/")
              if marker >= 0:
                  return value[:marker] or "."
              if value.startswith("src/"):
                  return "."
              return ""


          def scope_category(scopes):
              scopes = set(scopes)
              has_production = bool(scopes & production_scopes)
              has_test = "test" in scopes
              if has_production and has_test:
                  return "MIXED"
              if has_production:
                  return "PRODUCTION"
              if has_test:
                  return "TEST_ONLY"
              return "OTHER"


          def coordinate(group_id, artifact_id, artifact_type, classifier):
              value = f"{group_id}:{artifact_id}:{artifact_type}"
              if classifier:
                  value += f":{classifier}"
              return value


          def repository_path(group_id, artifact_id, version, classifier):
              group_path = group_id.replace(".", "/")
              filename = f"{artifact_id}-{version}"
              if classifier:
                  filename += f"-{classifier}"
              filename += ".jar"
              return Path(group_path) / artifact_id / version / filename


          def logical_class_name(entry_name):
              name = entry_name
              if name.startswith("META-INF/versions/"):
                  parts = name.split("/", 3)
                  if len(parts) != 4 or not parts[2].isdigit():
                      return None
                  name = parts[3]
              elif name.startswith("META-INF/"):
                  return None

              if not name.endswith(".class"):
                  return None

              class_path = name[:-6]
              leaf = class_path.rsplit("/", 1)[-1]
              if leaf in {"module-info", "package-info"}:
                  return None
              if re.search(r"\$\d+(?:$|\$)", leaf):
                  return None
              if "$$Lambda$" in leaf:
                  return None

              return class_path.replace("/", ".")


          def jar_class_names(path):
              names = set()
              with zipfile.ZipFile(path) as archive:
                  for entry in archive.namelist():
                      class_name = logical_class_name(entry)
                      if class_name:
                          names.add(class_name)
              return sorted(names)


          def add_target(target):
              identity = "\0".join(
                  (
                      target["targetOrigin"],
                      target["coordinate"],
                      target["kind"],
                      target["signature"],
                  )
              )
              target_id = hashlib.sha256(identity.encode("utf-8")).hexdigest()[:24]
              target["targetId"] = target_id
              targets.append(target)
              target_rows.append(
                  "\t".join(
                      (
                          target_id,
                          encode(target["coordinate"]),
                          encode(target["groupId"]),
                          encode(target["artifactId"]),
                          encode(target["oldVersion"]),
                          encode(target["newVersion"]),
                          encode(target["dependencyScopeCategory"]),
                          encode(target["analysisMode"]),
                          target["kind"],
                          encode(target["className"]),
                          encode(target["name"]),
                          encode(target["signature"]),
                          encode(target["changeStatus"]),
                          str(target["binaryCompatible"]).lower(),
                          str(target["sourceCompatible"]).lower(),
                          encode(list_separator.join(target["compatibilityTypes"])),
                          encode(list_separator.join(target["parameters"])),
                          encode(target["reportPath"]),
                          encode(target["markdownReportPath"]),
                      )
                  )
              )


          source_markers = (
              "/src/main/java/",
              "/src/test/java/",
              "/src/integration-test/java/",
              "/src/integrationTest/java/",
              "/src/it/java/",
              "/src/testFixtures/java/",
          )
          excluded_parts = {
              ".git",
              ".gradle",
              ".idea",
              "build",
              "node_modules",
              "target",
          }

          source_files = []
          if source_root.is_dir():
              for path in source_root.rglob("*.java"):
                  relative = path.relative_to(source_root)
                  normalized = f"/{relative.as_posix()}/"
                  if any(part in excluded_parts for part in relative.parts):
                      continue
                  if not any(marker in normalized for marker in source_markers):
                      continue
                  source_files.append(path.resolve())

          source_files.sort(key=lambda path: path.relative_to(source_root).as_posix())
          if len(source_files) > max_source_files:
              raise ValueError(
                  f"Refusing to analyze {len(source_files)} Java source files; "
                  f"MAX_JAVA_SOURCE_FILES is {max_source_files}"
              )

          source_manifest = []
          for path in source_files:
              relative = path.relative_to(source_root)
              source_manifest.append(
                  {
                      "path": relative.as_posix(),
                      "sourceSet": source_set(relative),
                      "modulePath": module_path(relative),
                      "sizeBytes": path.stat().st_size,
                      "sha256": sha256(path),
                  }
              )

          classpath_paths = []
          if resolved_base.is_dir():
              classpath_paths = sorted(
                  (path.resolve() for path in resolved_base.rglob("*.jar")),
                  key=lambda path: path.relative_to(resolved_base).as_posix(),
              )

          classpath_entries = [
              {
                  "path": path.relative_to(resolved_base).as_posix(),
                  "sizeBytes": path.stat().st_size,
                  "sha256": sha256(path),
              }
              for path in classpath_paths
          ]

          incompatible = json.loads(
              (output_dir / "api-incompatible-changes.json").read_text(encoding="utf-8")
          )
          dependency_changes = json.loads(
              (output_dir / "dependency-changes.json").read_text(encoding="utf-8")
          )
          metadata = json.loads(
              (output_dir / "metadata.json").read_text(encoding="utf-8")
          )

          targets = []
          target_rows = []

          # 1) Existing Step-4A JApiCmp findings for VERSION_CHANGED dependencies.
          for change in incompatible.get("changes", []):
              if change.get("binaryCompatible", True) and change.get("sourceCompatible", True):
                  continue

              compatibility_types = sorted(
                  {
                      item["type"]
                      for item in change.get("compatibilityChanges", [])
                      if item.get("type")
                  }
              )
              add_target(
                  {
                      "targetOrigin": "JAPICMP_INCOMPATIBLE_API",
                      "dependencyChangeType": "VERSION_CHANGED",
                      "coordinate": change["coordinate"],
                      "groupId": change["groupId"],
                      "artifactId": change["artifactId"],
                      "classifier": change.get("classifier", ""),
                      "oldVersion": change["oldVersion"],
                      "newVersion": change["newVersion"],
                      "dependencyScopeCategory": change["scopeCategory"],
                      "analysisMode": change["analysisMode"],
                      "kind": change["kind"],
                      "className": change["className"],
                      "name": change["name"],
                      "parameters": change.get("parameters", []),
                      "signature": change["signature"],
                      "changeStatus": change["changeStatus"],
                      "binaryCompatible": change["binaryCompatible"],
                      "sourceCompatible": change["sourceCompatible"],
                      "compatibilityTypes": compatibility_types,
                      "reportPath": change["reportPath"],
                      "markdownReportPath": change["markdownReportPath"],
                      "matchStrategy": (
                          "TYPE_REFERENCE"
                          if change["kind"] == "CLASS"
                          else "RESOLVED_JAVA_SYMBOL"
                      ),
                  }
              )

          removed_dependencies = []
          removed_type_target_count = 0
          removed_inventory_failures = []

          # 2) Removed JARs do not have a new JAR for JApiCmp. Enumerate their
          #    class names only and let the Java compiler resolve actual usages
          #    against the old classpath. No classfile bytecode is inspected.
          for change in dependency_changes.get("changes", []):
              if change.get("changeType") != "REMOVED" or change.get("type", "jar") != "jar":
                  continue

              old = change.get("old") or {}
              versions = [str(value) for value in old.get("versions", [])]
              if len(versions) != 1:
                  removed_inventory_failures.append(
                      {
                          "reason": "AMBIGUOUS_OLD_VERSION",
                          "groupId": change.get("groupId"),
                          "artifactId": change.get("artifactId"),
                          "classifier": change.get("classifier") or "",
                          "versions": versions,
                      }
                  )
                  continue

              group_id = str(change["groupId"])
              artifact_id = str(change["artifactId"])
              classifier = str(change.get("classifier") or "")
              old_version = versions[0]
              scopes = sorted(str(value) for value in old.get("scopes", []))
              repo_path = repository_path(
                  group_id, artifact_id, old_version, classifier
              )
              jar_path = resolved_base / repo_path
              dep_coordinate = coordinate(
                  group_id, artifact_id, "jar", classifier
              )

              if not jar_path.is_file():
                  removed_inventory_failures.append(
                      {
                          "reason": "OLD_JAR_NOT_FOUND",
                          "coordinate": dep_coordinate,
                          "version": old_version,
                          "expectedPath": repo_path.as_posix(),
                      }
                  )
                  continue

              try:
                  class_names = jar_class_names(jar_path)
              except (OSError, zipfile.BadZipFile) as exc:
                  removed_inventory_failures.append(
                      {
                          "reason": "OLD_JAR_CLASS_INDEX_FAILED",
                          "coordinate": dep_coordinate,
                          "version": old_version,
                          "message": str(exc),
                      }
                  )
                  continue

              removed_dependencies.append(
                  {
                      "coordinate": dep_coordinate,
                      "groupId": group_id,
                      "artifactId": artifact_id,
                      "classifier": classifier,
                      "oldVersion": old_version,
                      "scopes": scopes,
                      "scopeCategory": scope_category(scopes),
                      "direct": bool(old.get("direct")),
                      "repositoryPath": repo_path.as_posix(),
                      "jarSha256": sha256(jar_path),
                      "classCount": len(class_names),
                      "classNames": class_names,
                  }
              )

              for class_name in class_names:
                  removed_type_target_count += 1
                  if removed_type_target_count > max_removed_targets:
                      raise ValueError(
                          "Refusing to analyze more than "
                          f"{max_removed_targets} types from removed dependencies"
                      )
                  add_target(
                      {
                          "targetOrigin": "REMOVED_DEPENDENCY_TYPE",
                          "dependencyChangeType": "REMOVED",
                          "coordinate": dep_coordinate,
                          "groupId": group_id,
                          "artifactId": artifact_id,
                          "classifier": classifier,
                          "oldVersion": old_version,
                          "newVersion": "",
                          "dependencyScopeCategory": scope_category(scopes),
                          "analysisMode": "REMOVED_DEPENDENCY_TYPE_SCAN",
                          "kind": "CLASS",
                          "className": class_name,
                          "name": class_name.rsplit(".", 1)[-1],
                          "parameters": [],
                          "signature": class_name,
                          "changeStatus": "REMOVED",
                          "binaryCompatible": False,
                          "sourceCompatible": False,
                          "compatibilityTypes": ["DEPENDENCY_REMOVED"],
                          "reportPath": "removed-dependency-type-index.json",
                          "markdownReportPath": "",
                          "matchStrategy": "TYPE_REFERENCE",
                      }
                  )

          # 3) Index classes from ADDED dependencies as a deterministic pool for
          #    the later replacement-planning step. We deliberately do not map
          #    old types to new types here.
          added_dependencies = []
          added_inventory_failures = []
          for change in dependency_changes.get("changes", []):
              if change.get("changeType") != "ADDED" or change.get("type", "jar") != "jar":
                  continue

              new = change.get("new") or {}
              versions = [str(value) for value in new.get("versions", [])]
              if len(versions) != 1:
                  added_inventory_failures.append(
                      {
                          "reason": "AMBIGUOUS_NEW_VERSION",
                          "groupId": change.get("groupId"),
                          "artifactId": change.get("artifactId"),
                          "classifier": change.get("classifier") or "",
                          "versions": versions,
                      }
                  )
                  continue

              group_id = str(change["groupId"])
              artifact_id = str(change["artifactId"])
              classifier = str(change.get("classifier") or "")
              new_version = versions[0]
              scopes = sorted(str(value) for value in new.get("scopes", []))
              repo_path = repository_path(
                  group_id, artifact_id, new_version, classifier
              )
              jar_path = resolved_head / repo_path
              dep_coordinate = coordinate(
                  group_id, artifact_id, "jar", classifier
              )

              if not jar_path.is_file():
                  added_inventory_failures.append(
                      {
                          "reason": "NEW_JAR_NOT_FOUND",
                          "coordinate": dep_coordinate,
                          "version": new_version,
                          "expectedPath": repo_path.as_posix(),
                      }
                  )
                  continue

              try:
                  class_names = jar_class_names(jar_path)
              except (OSError, zipfile.BadZipFile) as exc:
                  added_inventory_failures.append(
                      {
                          "reason": "NEW_JAR_CLASS_INDEX_FAILED",
                          "coordinate": dep_coordinate,
                          "version": new_version,
                          "message": str(exc),
                      }
                  )
                  continue

              added_dependencies.append(
                  {
                      "coordinate": dep_coordinate,
                      "groupId": group_id,
                      "artifactId": artifact_id,
                      "classifier": classifier,
                      "newVersion": new_version,
                      "scopes": scopes,
                      "scopeCategory": scope_category(scopes),
                      "direct": bool(new.get("direct")),
                      "repositoryPath": repo_path.as_posix(),
                      "jarSha256": sha256(jar_path),
                      "classCount": len(class_names),
                      "classNames": class_names,
                  }
              )

          targets.sort(
              key=lambda item: (
                  item["targetOrigin"],
                  item["coordinate"],
                  item["signature"],
                  item["targetId"],
              )
          )
          target_rows.sort()
          removed_dependencies.sort(key=lambda item: item["coordinate"])
          added_dependencies.sort(key=lambda item: item["coordinate"])
          removed_inventory_failures.sort(
              key=lambda item: (
                  item.get("coordinate") or "",
                  item.get("groupId") or "",
                  item.get("artifactId") or "",
                  item["reason"],
              )
          )
          added_inventory_failures.sort(
              key=lambda item: (
                  item.get("coordinate") or "",
                  item.get("groupId") or "",
                  item.get("artifactId") or "",
                  item["reason"],
              )
          )

          if targets and not classpath_paths:
              raise ValueError(
                  "Java API usage targets exist, but the old resolved dependency "
                  "classpath is empty"
              )

          source_set_counts = Counter(item["sourceSet"] for item in source_manifest)
          target_kind_counts = Counter(item["kind"] for item in targets)
          target_origin_counts = Counter(item["targetOrigin"] for item in targets)

          plan = {
              "schemaVersion": 2,
              "sources": [
                  "api-incompatible-changes.json",
                  "dependency-changes.json",
              ],
              "analysis": {
                  "engine": "JDK_COMPILER_AST_TYPE_ATTRIBUTION",
                  "bytecodeInspection": False,
                  "jarInspection": "CLASS_ENTRY_NAMES_ONLY",
                  "sourceLanguage": "JAVA",
                  "sourceSnapshot": "PR_HEAD",
                  "sourceSha": os.environ["HEAD_SHA"],
                  "symbolClasspathSnapshot": "PR_COMPARISON_BASE",
                  "symbolClasspathSha": metadata["base"]["comparisonSha"],
                  "reasonForOldClasspath": (
                      "Removed APIs and types from removed dependencies must be "
                      "resolved against dependency versions that still contain them."
                  ),
                  "annotationProcessing": False,
                  "selection": [
                      "JApiCmp: binaryCompatible == false OR sourceCompatible == false",
                      "Maven: all source-addressable class entries from REMOVED JAR dependencies",
                  ],
                  "addedDependencyHandling": (
                      "Class names from ADDED JAR dependencies are indexed as a "
                      "replacement candidate pool only; no replacement is inferred."
                  ),
                  "supportedUsages": [
                      "METHOD_INVOCATION",
                      "METHOD_REFERENCE",
                      "METHOD_OVERRIDE",
                      "LAMBDA_IMPLEMENTATION",
                      "CONSTRUCTOR_CALL",
                      "CONSTRUCTOR_REFERENCE",
                      "CONSTRUCTOR_INVOCATION",
                      "FIELD_ACCESS",
                      "TYPE_REFERENCE",
                      "TYPE_IMPORT",
                  ],
                  "excludedUsages": [
                      "REFLECTION",
                      "STRING_BASED_CLASS_NAMES",
                      "NON_JAVA_SOURCE",
                      "RESOURCE_CONFIGURATION",
                  ],
              },
              "limits": {
                  "maxJavaSourceFiles": max_source_files,
                  "maxRemovedDependencyTypeTargets": max_removed_targets,
              },
              "summary": {
                  "targetCount": len(targets),
                  "japicmpTargetCount": target_origin_counts.get(
                      "JAPICMP_INCOMPATIBLE_API", 0
                  ),
                  "removedDependencyTypeTargetCount": target_origin_counts.get(
                      "REMOVED_DEPENDENCY_TYPE", 0
                  ),
                  "removedDependencyCount": len(removed_dependencies),
                  "removedDependencyInventoryFailureCount": len(
                      removed_inventory_failures
                  ),
                  "addedDependencyCount": len(added_dependencies),
                  "addedDependencyInventoryFailureCount": len(
                      added_inventory_failures
                  ),
                  "addedDependencyTypeCount": sum(
                      item["classCount"] for item in added_dependencies
                  ),
                  "sourceFileCount": len(source_manifest),
                  "classpathEntryCount": len(classpath_entries),
                  "targetKindCounts": dict(sorted(target_kind_counts.items())),
                  "targetOriginCounts": dict(sorted(target_origin_counts.items())),
                  "sourceSetCounts": dict(sorted(source_set_counts.items())),
              },
              "targets": targets,
          }

          (output_dir / "api-usage-plan.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (output_dir / "api-usage-targets.tsv").write_text(
              "\n".join(target_rows) + ("\n" if target_rows else ""),
              encoding="utf-8",
          )
          (output_dir / "removed-dependency-type-index.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "selection": "REMOVED Maven dependencies of type jar",
                      "bytecodeInspection": False,
                      "count": len(removed_dependencies),
                      "typeCount": sum(
                          item["classCount"] for item in removed_dependencies
                      ),
                      "dependencies": removed_dependencies,
                      "failures": removed_inventory_failures,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          (output_dir / "added-dependency-type-index.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "purpose": "REPLACEMENT_CANDIDATE_POOL_ONLY",
                      "selection": "ADDED Maven dependencies of type jar",
                      "bytecodeInspection": False,
                      "count": len(added_dependencies),
                      "typeCount": sum(
                          item["classCount"] for item in added_dependencies
                      ),
                      "dependencies": added_dependencies,
                      "failures": added_inventory_failures,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          with (output_dir / "added-dependency-types.jsonl").open(
              "w", encoding="utf-8"
          ) as handle:
              for dependency in added_dependencies:
                  for class_name in dependency["classNames"]:
                      handle.write(
                          json.dumps(
                              {
                                  "coordinate": dependency["coordinate"],
                                  "newVersion": dependency["newVersion"],
                                  "scopeCategory": dependency["scopeCategory"],
                                  "className": class_name,
                              },
                              sort_keys=True,
                          )
                          + "\n"
                      )

          (output_dir / "api-usage-source-manifest.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "snapshot": "PR_HEAD",
                      "sha": os.environ["HEAD_SHA"],
                      "count": len(source_manifest),
                      "sources": source_manifest,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          (output_dir / "api-usage-classpath.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "snapshot": "PR_COMPARISON_BASE",
                      "sha": metadata["base"]["comparisonSha"],
                      "count": len(classpath_entries),
                      "entries": classpath_entries,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          (output_dir / "api-usage-source-files.txt").write_text(
              "\n".join(item["path"] for item in source_manifest)
              + ("\n" if source_manifest else ""),
              encoding="utf-8",
          )

          Path(os.environ["RUNNER_TEMP"], "api-usage-sources.paths").write_text(
              "\n".join(str(path) for path in source_files)
              + ("\n" if source_files else ""),
              encoding="utf-8",
          )
          Path(os.environ["RUNNER_TEMP"], "api-usage-classpath.paths").write_text(
              "\n".join(str(path) for path in classpath_paths)
              + ("\n" if classpath_paths else ""),
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"count={len(targets)}\n")
              output.write(f"source_count={len(source_files)}\n")
              output.write(f"classpath_count={len(classpath_paths)}\n")
              output.write(
                  "removed_type_target_count="
                  f"{target_origin_counts.get('REMOVED_DEPENDENCY_TYPE', 0)}\n"
              )
          PY

      - name: Verify and compile Java source-usage analyzer
        if: steps.usage-plan.outputs.count != '0' && steps.usage-plan.outputs.source_count != '0'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pr-change
          BASE_BRANCH_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          analyzer_root="${RUNNER_TEMP}/java-api-usage-analyzer"
          analyzer_source="${analyzer_root}/JavaApiUsageAnalyzer.java"
          analyzer_classes="${analyzer_root}/classes"

          rm -rf -- "${analyzer_root}"
          mkdir -p -- "${analyzer_classes}" "${OUTPUT_DIR}/analysis-tools"

          if ! git show \
            "${BASE_BRANCH_SHA}:.github/scripts/JavaApiUsageAnalyzer.java" \
            > "${analyzer_source}"; then
            echo "::error::Java API usage analyzer is missing in trusted base commit ${BASE_BRANCH_SHA}"
            exit 1
          fi

          if [[ ! -s "${analyzer_source}" ]]; then
            echo "::error::Java API usage analyzer from base commit is empty"
            exit 1
          fi

          printf '%s  %s\n' \
            "${JAVA_USAGE_ANALYZER_SHA256}" \
            "${analyzer_source}" \
            | sha256sum --check --strict -

          javac \
            --release "${JAVA_VERSION}" \
            -encoding UTF-8 \
            -d "${analyzer_classes}" \
            "${analyzer_source}"

          cp "${analyzer_source}" \
            "${OUTPUT_DIR}/analysis-tools/JavaApiUsageAnalyzer.java"

          java -version 2>&1 \
            | tee "${OUTPUT_DIR}/api-usage-java-version.txt"
          javac -version 2>&1 \
            | tee "${OUTPUT_DIR}/api-usage-javac-version.txt"

          OUTPUT_DIR="${OUTPUT_DIR}" \
          JAVA_USAGE_ANALYZER_SHA256="${JAVA_USAGE_ANALYZER_SHA256}" \
          BASE_BRANCH_SHA="${BASE_BRANCH_SHA}" \
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ["OUTPUT_DIR"])
          tool = {
              "name": "JavaApiUsageAnalyzer",
              "engine": "JDK compiler Tree API with type attribution",
              "sourcePath": "analysis-tools/JavaApiUsageAnalyzer.java",
              "sourceCommit": os.environ["BASE_BRANCH_SHA"],
              "sourceTrust": "PULL_REQUEST_BASE",
              "sourceSha256": os.environ["JAVA_USAGE_ANALYZER_SHA256"],
              "javaRelease": os.environ["JAVA_VERSION"],
              "annotationProcessing": False,
              "bytecodeInspection": False,
              "executed": True,
          }
          (output_dir / "api-usage-tool.json").write_text(
              json.dumps(tool, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Map incompatible APIs to Java source usages
        if: steps.usage-plan.outputs.count != '0' && steps.usage-plan.outputs.source_count != '0'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pr-change
          SOURCE_ROOT: ${{ runner.temp }}/dependency-head
        run: |
          set -euo pipefail

          failure_file="${OUTPUT_DIR}/api-usage-failure.json"
          trap 'status=$?; python3 - "${failure_file}" "${status}" <<'"'"'PY'"'"'
          import json
          import sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "stage": "JAVA_SOURCE_USAGE_ANALYSIS",
                      "exitCode": int(sys.argv[2]),
                      "message": "Java source-usage analyzer failed technically.",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          exit "${status}"' ERR

          java \
            "-Xmx${JAVA_USAGE_ANALYZER_MAX_HEAP}" \
            --add-modules jdk.compiler \
            -cp "${RUNNER_TEMP}/java-api-usage-analyzer/classes" \
            JavaApiUsageAnalyzer \
            --repo-root "${SOURCE_ROOT}" \
            --sources "${RUNNER_TEMP}/api-usage-sources.paths" \
            --classpath "${RUNNER_TEMP}/api-usage-classpath.paths" \
            --targets "${OUTPUT_DIR}/api-usage-targets.tsv" \
            --usage-output "${OUTPUT_DIR}/api-usage-raw.tsv" \
            --resolution-output "${OUTPUT_DIR}/api-usage-target-resolution-raw.tsv" \
            --diagnostic-output "${OUTPUT_DIR}/api-usage-compiler-diagnostics-raw.tsv" \
            --metrics-output "${OUTPUT_DIR}/api-usage-analyzer-metrics.properties" \
            --release "${JAVA_VERSION}"

      - name: Create normalized Java source-impact result
        shell: bash
        if: success()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/pr-change
        run: |
          set -euo pipefail

          OUTPUT_DIR="${OUTPUT_DIR}" python3 <<'PY'
          import base64
          import json
          import os
          from collections import Counter, defaultdict
          from pathlib import Path

          output_dir = Path(os.environ["OUTPUT_DIR"])
          plan = json.loads(
              (output_dir / "api-usage-plan.json").read_text(encoding="utf-8")
          )
          targets = plan.get("targets", [])
          targets_by_id = {item["targetId"]: item for item in targets}
          list_separator = "\x1f"

          tool_file = output_dir / "api-usage-tool.json"
          if not tool_file.is_file():
              if not targets:
                  not_executed_reason = "NO_INCOMPATIBLE_API_TARGETS"
              elif not plan["summary"]["sourceFileCount"]:
                  not_executed_reason = "NO_JAVA_SOURCES"
              else:
                  not_executed_reason = "ANALYZER_NOT_EXECUTED"
              tool_file.write_text(
                  json.dumps(
                      {
                          "name": "JavaApiUsageAnalyzer",
                          "engine": "JDK compiler Tree API with type attribution",
                          "sourceSha256": os.environ[
                              "JAVA_USAGE_ANALYZER_SHA256"
                          ],
                          "javaRelease": os.environ["JAVA_VERSION"],
                          "annotationProcessing": False,
                          "bytecodeInspection": False,
                          "executed": False,
                          "notExecutedReason": not_executed_reason,
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )


          def decode(value):
              if not value:
                  return ""
              padding = "=" * ((4 - len(value) % 4) % 4)
              return base64.urlsafe_b64decode(value + padding).decode("utf-8")


          def read_properties(path):
              result = {}
              if not path.is_file():
                  return result
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  try:
                      result[key] = int(value)
                  except ValueError:
                      result[key] = value
              return result


          def read_tsv(path):
              if not path.is_file():
                  return []
              return [
                  line.split("\t")
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line
              ]


          metrics = read_properties(
              output_dir / "api-usage-analyzer-metrics.properties"
          )
          if not metrics:
              metrics = {
                  "sourceFileCount": plan["summary"]["sourceFileCount"],
                  "classpathEntryCount": plan["summary"]["classpathEntryCount"],
                  "compilationUnitCount": 0,
                  "targetCount": len(targets),
                  "resolvedTargetCount": 0,
                  "unresolvedTargetCount": len(targets),
                  "usageCount": 0,
                  "diagnosticCount": 0,
                  "diagnosticErrorCount": 0,
                  "diagnosticWarningCount": 0,
                  "unresolvedMethodInvocationCount": 0,
                  "unresolvedConstructorCallCount": 0,
                  "unresolvedMemberReferenceCount": 0,
                  "unresolvedLambdaTypeCount": 0,
              }

          resolutions = {}
          for columns in read_tsv(
              output_dir / "api-usage-target-resolution-raw.tsv"
          ):
              if len(columns) != 5:
                  raise ValueError(
                      f"Expected 5 target-resolution columns, got {len(columns)}"
                  )
              symbols_value = decode(columns[2])
              resolutions[columns[0]] = {
                  "resolved": columns[1].lower() == "true",
                  "resolvedSymbols": (
                      symbols_value.split(list_separator)
                      if symbols_value
                      else []
                  ),
                  "message": decode(columns[3]),
                  "usageCount": int(columns[4]),
              }

          usages = []
          for columns in read_tsv(output_dir / "api-usage-raw.tsv"):
              if len(columns) != 18:
                  raise ValueError(
                      f"Expected 18 usage columns, got {len(columns)}"
                  )
              target_id = columns[0]
              target = targets_by_id.get(target_id)
              if target is None:
                  raise ValueError(f"Unknown target ID in usage output: {target_id}")

              usage = {
                  "targetId": target_id,
                  "coordinate": target["coordinate"],
                  "targetKind": target["kind"],
                  "targetOrigin": target.get("targetOrigin", "JAPICMP_INCOMPATIBLE_API"),
                  "dependencyChangeType": target.get("dependencyChangeType", "VERSION_CHANGED"),
                  "targetSignature": target["signature"],
                  "dependencyScopeCategory": target[
                      "dependencyScopeCategory"
                  ],
                  "analysisMode": target["analysisMode"],
                  "compatibilityTypes": target["compatibilityTypes"],
                  "usageKind": columns[1],
                  "matchKind": columns[2],
                  "confidence": columns[3],
                  "sourceSet": columns[4],
                  "sourceFile": decode(columns[5]),
                  "modulePath": decode(columns[6]),
                  "line": int(columns[7]),
                  "column": int(columns[8]),
                  "endLine": int(columns[9]),
                  "endColumn": int(columns[10]),
                  "enclosingType": decode(columns[11]),
                  "enclosingMethod": decode(columns[12]),
                  "resolvedSymbol": decode(columns[13]),
                  "expression": decode(columns[14]),
                  "lineText": decode(columns[15]),
                  "startPosition": int(columns[16]),
                  "endPosition": int(columns[17]),
              }
              usages.append(usage)

          usages.sort(
              key=lambda item: (
                  item["sourceFile"],
                  item["line"],
                  item["column"],
                  item["targetSignature"],
                  item["usageKind"],
              )
          )

          diagnostics = []
          for columns in read_tsv(
              output_dir / "api-usage-compiler-diagnostics-raw.tsv"
          ):
              if len(columns) != 6:
                  raise ValueError(
                      f"Expected 6 compiler-diagnostic columns, got {len(columns)}"
                  )
              diagnostics.append(
                  {
                      "kind": columns[0],
                      "code": decode(columns[1]),
                      "sourceFile": decode(columns[2]),
                      "line": int(columns[3]),
                      "column": int(columns[4]),
                      "message": decode(columns[5]),
                  }
              )
          diagnostics.sort(
              key=lambda item: (
                  item["sourceFile"],
                  item["line"],
                  item["column"],
                  item["kind"],
                  item["code"],
              )
          )

          usages_by_target = defaultdict(list)
          for usage in usages:
              usages_by_target[usage["targetId"]].append(usage)

          impacts = []
          for target in targets:
              target_usages = usages_by_target[target["targetId"]]
              resolution = resolutions.get(
                  target["targetId"],
                  {
                      "resolved": False,
                      "resolvedSymbols": [],
                      "message": (
                          "Analyzer was not executed because there were no "
                          "selected source files."
                      ),
                      "usageCount": 0,
                  },
              )
              source_set_counts = Counter(
                  item["sourceSet"] for item in target_usages
              )
              usage_kind_counts = Counter(
                  item["usageKind"] for item in target_usages
              )
              confidence_counts = Counter(
                  item["confidence"] for item in target_usages
              )
              impacts.append(
                  {
                      "target": target,
                      "resolution": resolution,
                      "impact": {
                          "used": bool(target_usages),
                          "usageCount": len(target_usages),
                          "affectedSourceFileCount": len(
                              {item["sourceFile"] for item in target_usages}
                          ),
                          "affectedSourceFiles": sorted(
                              {item["sourceFile"] for item in target_usages}
                          ),
                          "sourceSetCounts": dict(
                              sorted(source_set_counts.items())
                          ),
                          "usageKindCounts": dict(
                              sorted(usage_kind_counts.items())
                          ),
                          "confidenceCounts": dict(
                              sorted(confidence_counts.items())
                          ),
                      },
                      "usages": target_usages,
                  }
              )

          impacts.sort(
              key=lambda item: (
                  item["target"]["coordinate"],
                  item["target"]["signature"],
              )
          )

          used_impacts = [item for item in impacts if item["impact"]["used"]]
          unmatched_impacts = [
              item for item in impacts if not item["impact"]["used"]
          ]
          unresolved_impacts = [
              item for item in impacts if not item["resolution"]["resolved"]
          ]

          source_set_counts = Counter(item["sourceSet"] for item in usages)
          usage_kind_counts = Counter(item["usageKind"] for item in usages)
          match_kind_counts = Counter(item["matchKind"] for item in usages)
          confidence_counts = Counter(item["confidence"] for item in usages)
          dependency_scope_counts = Counter(
              item["dependencyScopeCategory"] for item in usages
          )
          target_origin_usage_counts = Counter(
              item["targetOrigin"] for item in usages
          )
          target_origin_target_counts = Counter(
              item.get("targetOrigin", "JAPICMP_INCOMPATIBLE_API")
              for item in targets
          )
          used_target_origin_counts = Counter(
              item["target"].get("targetOrigin", "JAPICMP_INCOMPATIBLE_API")
              for item in used_impacts
          )
          removed_dependency_usages = [
              item
              for item in usages
              if item["targetOrigin"] == "REMOVED_DEPENDENCY_TYPE"
          ]
          japicmp_usages = [
              item
              for item in usages
              if item["targetOrigin"] == "JAPICMP_INCOMPATIBLE_API"
          ]

          incomplete_reasons = []
          if unresolved_impacts:
              incomplete_reasons.append("UNRESOLVED_API_TARGETS")
          if metrics.get("diagnosticErrorCount", 0):
              incomplete_reasons.append("JAVA_COMPILER_ERRORS")
          if metrics.get("unresolvedMethodInvocationCount", 0):
              incomplete_reasons.append("UNRESOLVED_METHOD_INVOCATIONS")
          if metrics.get("unresolvedConstructorCallCount", 0):
              incomplete_reasons.append("UNRESOLVED_CONSTRUCTOR_CALLS")
          if metrics.get("unresolvedMemberReferenceCount", 0):
              incomplete_reasons.append("UNRESOLVED_MEMBER_REFERENCES")
          if metrics.get("unresolvedLambdaTypeCount", 0):
              incomplete_reasons.append("UNRESOLVED_LAMBDA_TYPES")

          if not targets:
              quality = "NOT_APPLICABLE"
          elif not plan["summary"]["sourceFileCount"]:
              quality = "NO_JAVA_SOURCES"
          elif incomplete_reasons:
              quality = "PARTIAL"
          else:
              quality = "COMPLETE"

          summary = {
              "analysisQuality": quality,
              "incompleteReasons": incomplete_reasons,
              "targetCount": len(targets),
              "resolvedTargetCount": sum(
                  item["resolution"]["resolved"] for item in impacts
              ),
              "unresolvedTargetCount": len(unresolved_impacts),
              "usedTargetCount": len(used_impacts),
              "unusedTargetCount": len(unmatched_impacts),
              "usageCount": len(usages),
              "affectedSourceFileCount": len(
                  {item["sourceFile"] for item in usages}
              ),
              "highConfidenceUsageCount": confidence_counts.get("HIGH", 0),
              "mediumConfidenceUsageCount": confidence_counts.get("MEDIUM", 0),
              "sourceSetCounts": dict(sorted(source_set_counts.items())),
              "usageKindCounts": dict(sorted(usage_kind_counts.items())),
              "matchKindCounts": dict(sorted(match_kind_counts.items())),
              "dependencyScopeUsageCounts": dict(
                  sorted(dependency_scope_counts.items())
              ),
              "targetOriginCounts": dict(
                  sorted(target_origin_target_counts.items())
              ),
              "usedTargetOriginCounts": dict(
                  sorted(used_target_origin_counts.items())
              ),
              "usageOriginCounts": dict(
                  sorted(target_origin_usage_counts.items())
              ),
              "japicmpUsageCount": len(japicmp_usages),
              "removedDependencyUsageCount": len(removed_dependency_usages),
              "removedDependencyUsedTypeCount": len(
                  {item["targetSignature"] for item in removed_dependency_usages}
              ),
              "removedDependencyAffectedSourceFileCount": len(
                  {item["sourceFile"] for item in removed_dependency_usages}
              ),
              "sourceFileCount": metrics.get("sourceFileCount", 0),
              "classpathEntryCount": metrics.get("classpathEntryCount", 0),
              "compilationUnitCount": metrics.get("compilationUnitCount", 0),
              "compilerDiagnosticCount": metrics.get("diagnosticCount", 0),
              "compilerErrorCount": metrics.get("diagnosticErrorCount", 0),
              "compilerWarningCount": metrics.get(
                  "diagnosticWarningCount", 0
              ),
              "unresolvedMethodInvocationCount": metrics.get(
                  "unresolvedMethodInvocationCount", 0
              ),
              "unresolvedConstructorCallCount": metrics.get(
                  "unresolvedConstructorCallCount", 0
              ),
              "unresolvedMemberReferenceCount": metrics.get(
                  "unresolvedMemberReferenceCount", 0
              ),
              "unresolvedLambdaTypeCount": metrics.get(
                  "unresolvedLambdaTypeCount", 0
              ),
          }

          impact_result = {
              "schemaVersion": 1,
              "source": "api-usage-plan.json",
              "analysis": plan["analysis"],
              "summary": summary,
              "impacts": impacts,
          }

          (output_dir / "api-usage-impact.json").write_text(
              json.dumps(impact_result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (output_dir / "api-usage-summary.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "analysis": plan["analysis"],
                      "summary": summary,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          (output_dir / "api-usage-target-results.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "count": len(impacts),
                      "targets": impacts,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          (output_dir / "api-usage-unmatched.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "count": len(unmatched_impacts),
                      "targets": unmatched_impacts,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          (output_dir / "api-usage-unresolved-targets.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "count": len(unresolved_impacts),
                      "targets": unresolved_impacts,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          with (output_dir / "api-usages.jsonl").open(
              "w", encoding="utf-8"
          ) as handle:
              for usage in usages:
                  handle.write(
                      json.dumps(usage, sort_keys=True, ensure_ascii=False)
                      + "\n"
                  )

          with (output_dir / "japicmp-api-usages.jsonl").open(
              "w", encoding="utf-8"
          ) as handle:
              for usage in japicmp_usages:
                  handle.write(
                      json.dumps(usage, sort_keys=True, ensure_ascii=False)
                      + "\n"
                  )

          with (output_dir / "removed-dependency-usages.jsonl").open(
              "w", encoding="utf-8"
          ) as handle:
              for usage in removed_dependency_usages:
                  handle.write(
                      json.dumps(usage, sort_keys=True, ensure_ascii=False)
                      + "\n"
                  )

          removed_dependency_impacts = [
              item
              for item in impacts
              if item["target"].get("targetOrigin") == "REMOVED_DEPENDENCY_TYPE"
              and item["impact"]["used"]
          ]
          (output_dir / "removed-dependency-impact.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "summary": {
                          "usedTypeCount": len(removed_dependency_impacts),
                          "usageCount": len(removed_dependency_usages),
                          "affectedSourceFileCount": len(
                              {
                                  item["sourceFile"]
                                  for item in removed_dependency_usages
                              }
                          ),
                      },
                      "impacts": removed_dependency_impacts,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          (output_dir / "removed-dependency-usages.txt").write_text(
              "\n".join(
                  "\t".join(
                      (
                          item["coordinate"],
                          item["targetSignature"],
                          item["sourceSet"],
                          item["sourceFile"],
                          str(item["line"]),
                          str(item["column"]),
                          item["usageKind"],
                      )
                  )
                  for item in removed_dependency_usages
              )
              + ("\n" if removed_dependency_usages else ""),
              encoding="utf-8",
          )

          with (output_dir / "api-usage-compiler-diagnostics.jsonl").open(
              "w", encoding="utf-8"
          ) as handle:
              for diagnostic in diagnostics:
                  handle.write(
                      json.dumps(
                          diagnostic,
                          sort_keys=True,
                          ensure_ascii=False,
                      )
                      + "\n"
                  )

          def write_usage_list(filename, selected):
              lines = []
              for item in selected:
                  lines.append(
                      "\t".join(
                          (
                              item["coordinate"],
                              item["targetSignature"],
                              item["sourceSet"],
                              item["sourceFile"],
                              str(item["line"]),
                              str(item["column"]),
                              item["usageKind"],
                              item["confidence"],
                          )
                      )
                  )
              (output_dir / filename).write_text(
                  "\n".join(lines) + ("\n" if lines else ""),
                  encoding="utf-8",
              )

          write_usage_list(
              "api-usages-main.txt",
              [item for item in usages if item["sourceSet"] == "MAIN"],
          )
          write_usage_list(
              "api-usages-test.txt",
              [
                  item
                  for item in usages
                  if item["sourceSet"]
                  in {"TEST", "INTEGRATION_TEST", "TEST_FIXTURE"}
              ],
          )
          write_usage_list(
              "api-usages-other.txt",
              [
                  item
                  for item in usages
                  if item["sourceSet"]
                  not in {
                      "MAIN",
                      "TEST",
                      "INTEGRATION_TEST",
                      "TEST_FIXTURE",
                  }
              ],
          )

          summary_lines = [
              "## Java source impact of incompatible dependency APIs",
              "",
              f"- Analysis quality: **{quality}**",
              f"- Total source-impact targets: **{len(targets)}**",
              f"- JApiCmp incompatible API targets: **{target_origin_target_counts.get('JAPICMP_INCOMPATIBLE_API', 0)}**",
              f"- Removed-dependency type targets: **{target_origin_target_counts.get('REMOVED_DEPENDENCY_TYPE', 0)}**",
              f"- Targets used by project source: **{len(used_impacts)}**",
              f"- JApiCmp API usages: **{len(japicmp_usages)}**",
              f"- Removed-dependency type usages: **{len(removed_dependency_usages)}**",
              f"- Concrete source usages: **{len(usages)}**",
              f"- Affected source files: **{summary['affectedSourceFileCount']}**",
              f"- Main-source usages: **{source_set_counts.get('MAIN', 0)}**",
              f"- Test-source usages: **{sum(source_set_counts.get(name, 0) for name in ('TEST', 'INTEGRATION_TEST', 'TEST_FIXTURE'))}**",
              f"- Resolved API targets: **{summary['resolvedTargetCount']}/{len(targets)}**",
              f"- Java compiler errors during attribution: **{summary['compilerErrorCount']}**",
              "",
          ]

          if incomplete_reasons:
              summary_lines.extend(
                  (
                      "### Analysis limitations detected",
                      "",
                      *[f"- `{reason}`" for reason in incomplete_reasons],
                      "",
                  )
              )

          if usages:
              summary_lines.extend(
                  (
                      "### Detected usages",
                      "",
                      "| Dependency | Source-impact target | Source | Location | Usage | Confidence |",
                      "|---|---|---|---:|---|---|",
                  )
              )
              for usage in usages[:100]:
                  summary_lines.append(
                      f"| `{usage['coordinate']}` | "
                      f"`{usage['targetSignature']}` | "
                      f"`{usage['sourceFile']}` | "
                      f"{usage['line']}:{usage['column']} | "
                      f"{usage['usageKind']} | {usage['confidence']} |"
                  )
              if len(usages) > 100:
                  summary_lines.append(
                      f"\nOnly the first 100 of {len(usages)} usages are shown."
                  )
          elif targets:
              summary_lines.append(
                  "No source usage of a selected incompatible API or removed-dependency type was detected."
              )
          else:
              summary_lines.append(
                  "No JApiCmp incompatibilities or removed-dependency type targets were selected."
              )

          summary_markdown = "\n".join(summary_lines).rstrip() + "\n"
          (output_dir / "api-usage-summary.md").write_text(
              summary_markdown,
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write("\n" + summary_markdown)
          PY

      - name: Clean temporary analysis files
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -rf -- \
            "${RUNNER_TEMP}/resolved-jars" \
            "${RUNNER_TEMP}/japicmp-tool" \
            "${RUNNER_TEMP}/java-api-usage-analyzer" \
            "${RUNNER_TEMP}/api-usage-sources.paths" \
            "${RUNNER_TEMP}/api-usage-classpath.paths"

      - name: Create checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          (
            cd "${RUNNER_TEMP}/pr-change"

            find . \
              -type f \
              ! -name SHA256SUMS \
              -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS
          )

      - name: Upload dependency API diff and Java source impact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-dependency-source-impact-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr-change
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
