name: PR 06 - AI migration plan

on:
  workflow_run:
    workflows:
      - "PR 05 - Map incompatible and removed Maven API usages"
    types:
      - completed
  workflow_dispatch:
    inputs:
      step5_run_id:
        description: "Successful Step-5 workflow run ID whose artifact should be analyzed"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-migration-plan-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.step5_run_id || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  GROQ_MODEL: openai/gpt-oss-120b
  AI_REASONING_EFFORT: medium
  AI_MAX_OUTPUT_TOKENS: "12000"

jobs:
  plan-migration:
    name: Build validated AI migration plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       (github.event.workflow_run.actor.login == 'renovate[bot]' ||
        github.event.workflow_run.actor.login == github.repository_owner))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted pipeline code from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify Step 5 workflow run
        id: source_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.step5_run_id }}
          EXPECTED_WORKFLOW_NAME: PR 05 - Map incompatible and removed Maven API usages
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_id="${MANUAL_RUN_ID}"
          else
            run_id="${AUTOMATIC_RUN_ID}"
          fi

          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Step-5 workflow run ID: ${run_id}"
            exit 1
          fi

          response_file="${RUNNER_TEMP}/step5-workflow-run.json"
          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}")"

          if [[ "${http_code}" != "200" ]]; then
            echo "::error::Unable to read workflow run ${run_id}; GitHub API returned HTTP ${http_code}."
            cat "${response_file}" || true
            exit 1
          fi

          workflow_name="$(jq -r '.name // ""' "${response_file}")"
          conclusion="$(jq -r '.conclusion // ""' "${response_file}")"
          trigger_event="$(jq -r '.event // ""' "${response_file}")"
          head_sha="$(jq -r '.head_sha // ""' "${response_file}")"

          if [[ "${workflow_name}" != "${EXPECTED_WORKFLOW_NAME}" ]]; then
            echo "::error::Run ${run_id} belongs to workflow '${workflow_name}', expected '${EXPECTED_WORKFLOW_NAME}'."
            exit 1
          fi

          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::Step-5 run ${run_id} is not successful; conclusion=${conclusion}."
            exit 1
          fi

          if [[ "${trigger_event}" != "pull_request" ]]; then
            echo "::error::Step-5 run ${run_id} was not triggered by pull_request; event=${trigger_event}."
            exit 1
          fi

          if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Step-5 run ${run_id} returned an invalid head SHA: ${head_sha}"
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download Step 5 analysis artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-dependency-source-impact-*
          path: ${{ runner.temp }}/step5-artifact
          merge-multiple: true
          run-id: ${{ steps.source_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify trusted analysis input
        id: verify
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/step5-artifact
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ steps.source_run.outputs.head_sha }}
        run: |
          set -euo pipefail

          required_files=(
            metadata.json
            dependency-changes.json
            api-usage-summary.json
            api-usage-impact.json
            api-usages.jsonl
            api-changes.jsonl
            added-dependency-type-index.json
            removed-dependency-impact.json
            SHA256SUMS
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "${ARTIFACT_DIR}/${file}" ]]; then
              echo "::error::Required Step 5 artifact file missing or empty: ${file}"
              exit 1
            fi
          done

          actual_repository="$(jq -r '.repository' "${ARTIFACT_DIR}/metadata.json")"
          actual_head_sha="$(jq -r '.head.sha' "${ARTIFACT_DIR}/metadata.json")"
          pr_number="$(jq -r '.pullRequest' "${ARTIFACT_DIR}/metadata.json")"

          if [[ "${actual_repository}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "::error::Artifact repository mismatch: ${actual_repository}"
            exit 1
          fi

          if [[ "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Artifact HEAD SHA mismatch: artifact=${actual_head_sha}, workflow_run=${EXPECTED_HEAD_SHA}"
            exit 1
          fi

          (
            cd "${ARTIFACT_DIR}"
            sha256sum --check --strict SHA256SUMS
          )

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${actual_head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify migration planner implementation
        shell: bash
        env:
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          if [[ ! -s "${PLANNER}" ]]; then
            echo "::error::Migration planner script is missing: ${PLANNER}"
            exit 1
          fi

          python3 -m py_compile "${PLANNER}"
          sha256sum "${PLANNER}" | tee "${RUNNER_TEMP}/planner-sha256.txt"

      - name: Build deterministic AI input and candidate set
        id: build
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/step5-artifact
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          rm -rf -- "${OUTPUT_DIR}"
          mkdir -p -- "${OUTPUT_DIR}"

          result="$(python3 "${PLANNER}" build \
            --artifact-dir "${ARTIFACT_DIR}" \
            --output-dir "${OUTPUT_DIR}")"

          printf '%s\n' "${result}" | tee "${OUTPUT_DIR}/ai-migration-build-result.json"

          impact_count="$(printf '%s' "${result}" | jq -r '.impactCount')"
          needs_ai="$(printf '%s' "${result}" | jq -r '.needsAi')"

          echo "impact_count=${impact_count}" >> "${GITHUB_OUTPUT}"
          echo "needs_ai=${needs_ai}" >> "${GITHUB_OUTPUT}"

      - name: Request batched AI migration plan
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          MODEL: ${{ env.GROQ_MODEL }}
          REASONING_EFFORT: ${{ env.AI_REASONING_EFFORT }}
          MAX_OUTPUT_TOKENS: ${{ env.AI_MAX_OUTPUT_TOKENS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_SIZE: "4"
          MAX_RATE_LIMIT_RETRIES: "8"
        run: |
          set -euo pipefail

          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::Repository secret GROQ_API_KEY is not configured."
            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          evidence = json.loads((out / "ai-migration-input.json").read_text(encoding="utf-8"))
          schema = json.loads((out / "ai-migration-output-schema.json").read_text(encoding="utf-8"))
          instructions = (out / "ai-migration-instructions.txt").read_text(encoding="utf-8").strip()
          batch_size = int(os.environ["BATCH_SIZE"])

          impacts = evidence.get("impacts", [])
          batch_dir = out / "groq-batches"
          batch_dir.mkdir(parents=True, exist_ok=True)

          manifest = {
              "batchSize": batch_size,
              "impactCount": len(impacts),
              "batchCount": 0,
              "batches": [],
          }

          for index, offset in enumerate(range(0, len(impacts), batch_size), start=1):
              batch_impacts = impacts[offset:offset + batch_size]
              batch_evidence = dict(evidence)
              batch_evidence["impactCount"] = len(batch_impacts)
              batch_evidence["impacts"] = batch_impacts

              request = {
                  "model": os.environ["MODEL"],
                  "store": False,
                  "reasoning": {"effort": os.environ["REASONING_EFFORT"]},
                  "max_output_tokens": int(os.environ["MAX_OUTPUT_TOKENS"]),
                  "input": [
                      {
                          "role": "developer",
                          "content": [{"type": "input_text", "text": instructions}],
                      },
                      {
                          "role": "user",
                          "content": [{
                              "type": "input_text",
                              "text": "Migration evidence JSON follows. Use only this data.\n"
                                      + json.dumps(batch_evidence, sort_keys=True),
                          }],
                      },
                  ],
                  "text": {
                      "format": {
                          "type": "json_schema",
                          "name": "dependency_migration_plan",
                          "strict": True,
                          "schema": schema,
                      }
                  },
              }

              stem = f"batch-{index:03d}"
              request_path = batch_dir / f"{stem}-request.json"
              request_path.write_text(json.dumps(request, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              manifest["batches"].append({
                  "batch": index,
                  "request": str(request_path.relative_to(out)),
                  "impactIds": [i["impactId"] for i in batch_impacts],
              })

          manifest["batchCount"] = len(manifest["batches"])
          (out / "groq-batch-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          batch_count="$(jq -r '.batchCount' "${OUTPUT_DIR}/groq-batch-manifest.json")"
          mkdir -p "${OUTPUT_DIR}/groq-batches"

          for batch in $(seq 1 "${batch_count}"); do
            stem="$(printf 'batch-%03d' "${batch}")"
            request_file="${OUTPUT_DIR}/groq-batches/${stem}-request.json"
            response_file="${OUTPUT_DIR}/groq-batches/${stem}-response.json"
            headers_file="${OUTPUT_DIR}/groq-batches/${stem}-headers.txt"
            raw_file="${OUTPUT_DIR}/groq-batches/${stem}-raw-plan.json"

            attempt=1
            while true; do
              : > "${headers_file}"
              http_code="$(curl \
                --silent \
                --show-error \
                --connect-timeout 20 \
                --max-time 300 \
                --output "${response_file}" \
                --dump-header "${headers_file}" \
                --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${GROQ_API_KEY}" \
                --header 'Content-Type: application/json' \
                --data-binary "@${request_file}" \
                https://api.groq.com/openai/v1/responses)"

              if [[ "${http_code}" == "200" ]]; then
                break
              fi

              error_message="$(jq -r '.error.message // .error // "unknown Groq API error"' "${response_file}" 2>/dev/null || true)"

              if [[ "${http_code}" == "429" && "${attempt}" -le "${MAX_RATE_LIMIT_RETRIES}" ]]; then
                retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\\r", "", $2); print $2}' "${headers_file}" | tail -1)"
                if [[ ! "${retry_after}" =~ ^[0-9]+$ ]]; then
                  retry_after=15
                fi
                echo "Groq rate limit for ${stem}; retrying in ${retry_after}s (attempt ${attempt}/${MAX_RATE_LIMIT_RETRIES})."
                sleep "${retry_after}"
                attempt=$((attempt + 1))
                continue
              fi

              if [[ "${http_code}" == "413" ]]; then
                echo "::error::Groq rejected ${stem} as too large even with BATCH_SIZE=${BATCH_SIZE}: ${error_message}"
              else
                echo "::error::Groq Responses API returned HTTP ${http_code} for ${stem}: ${error_message}"
              fi
              exit 1
            done

            status="$(jq -r '.status // ""' "${response_file}")"
            if [[ "${status}" != "completed" ]]; then
              echo "::error::Groq response for ${stem} did not complete successfully. status=${status}"
              jq '{id,status,error,incomplete_details}' "${response_file}" || true
              exit 1
            fi

            jq -r '[
              .output[]?
              | select(.type == "message")
              | .content[]?
              | select(.type == "output_text")
              | .text
            ] | join("")' "${response_file}" > "${raw_file}"

            if [[ ! -s "${raw_file}" ]]; then
              echo "::error::Groq response for ${stem} contained no structured output text."
              exit 1
            fi
            jq -e . "${raw_file}" >/dev/null
          done

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          manifest = json.loads((out / "groq-batch-manifest.json").read_text(encoding="utf-8"))
          decisions = []
          summaries = []
          responses = []
          usage_totals = {}

          for entry in manifest["batches"]:
              stem = f"batch-{entry['batch']:03d}"
              raw = json.loads((out / "groq-batches" / f"{stem}-raw-plan.json").read_text(encoding="utf-8"))
              response = json.loads((out / "groq-batches" / f"{stem}-response.json").read_text(encoding="utf-8"))
              batch_decisions = raw.get("decisions", [])
              decisions.extend(batch_decisions)
              if raw.get("summary"):
                  summaries.append(raw["summary"])
              usage = response.get("usage") or {}
              for key, value in usage.items():
                  if isinstance(value, int):
                      usage_totals[key] = usage_totals.get(key, 0) + value
              responses.append({
                  "batch": entry["batch"],
                  "responseId": response.get("id"),
                  "model": response.get("model"),
                  "status": response.get("status"),
                  "usage": usage,
              })

          combined = {
              "summary": " | ".join(summaries),
              "decisions": decisions,
          }
          (out / "ai-migration-plan-raw.json").write_text(
              json.dumps(combined, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          metadata = {
              "provider": "Groq",
              "endpoint": "Responses API",
              "model": os.environ["MODEL"],
              "store": False,
              "batchSize": int(os.environ["BATCH_SIZE"]),
              "batchCount": manifest["batchCount"],
              "responses": responses,
              "usageTotals": usage_totals,
          }
          (out / "ai-provider-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Repair incomplete AI OpenRewrite specifications
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
          MODEL: ${{ env.GROQ_MODEL }}
          REASONING_EFFORT: ${{ env.AI_REASONING_EFFORT }}
          MAX_OUTPUT_TOKENS: ${{ env.AI_MAX_OUTPUT_TOKENS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPAIR_BATCH_SIZE: "2"
          MAX_REPAIR_ROUNDS: "3"
          MAX_RATE_LIMIT_RETRIES: "8"
        run: |
          set -euo pipefail

          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::Repository secret GROQ_API_KEY is not configured."
            exit 1
          fi

          for round in $(seq 1 "${MAX_REPAIR_ROUNDS}"); do
            check_file="${OUTPUT_DIR}/ai-migration-repair-check.json"
            python3 "${PLANNER}" check \
              --input "${OUTPUT_DIR}/ai-migration-input.json" \
              --raw-plan "${OUTPUT_DIR}/ai-migration-plan-raw.json" \
              --report "${check_file}"

            if [[ "$(jq -r '.valid' "${check_file}")" == "true" ]]; then
              echo "AI plan is machine-actionable after $((round - 1)) repair round(s)."
              break
            fi

            invalid_count="$(jq -r '.invalidImpacts | length' "${check_file}")"
            global_count="$(jq -r '.globalErrors | length' "${check_file}")"
            if [[ "${global_count}" -gt 0 ]]; then
              echo "::error::AI plan has global structural errors that cannot be impact-repaired."
              jq . "${check_file}"
              exit 1
            fi
            if [[ "${invalid_count}" -eq 0 ]]; then
              echo "::error::AI repair check is invalid but contains no repairable impacts."
              jq . "${check_file}"
              exit 1
            fi

            echo "Repair round ${round}: ${invalid_count} impact decision(s) need a more concrete OpenRewrite specification."

            ROUND="${round}" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          round_no = int(os.environ["ROUND"])
          batch_size = int(os.environ["REPAIR_BATCH_SIZE"])
          evidence = json.loads((out / "ai-migration-input.json").read_text(encoding="utf-8"))
          schema = json.loads((out / "ai-migration-output-schema.json").read_text(encoding="utf-8"))
          base_instructions = (out / "ai-migration-instructions.txt").read_text(encoding="utf-8").strip()
          check = json.loads((out / "ai-migration-repair-check.json").read_text(encoding="utf-8"))
          raw_plan = json.loads((out / "ai-migration-plan-raw.json").read_text(encoding="utf-8"))

          impact_by_id = {i["impactId"]: i for i in evidence.get("impacts", [])}
          previous_by_id = {d.get("impactId"): d for d in raw_plan.get("decisions", []) if isinstance(d, dict)}
          invalid = check.get("invalidImpacts", [])

          repair_root = out / "groq-repairs" / f"round-{round_no:02d}"
          repair_root.mkdir(parents=True, exist_ok=True)
          manifest = {"round": round_no, "batchSize": batch_size, "invalidImpactCount": len(invalid), "batches": []}

          repair_instructions = base_instructions + """

          REPAIR MODE:
          The previous decisions below failed machine validation. Return a corrected decision for EVERY supplied impactId and fix EVERY listed validation error.
          Do not repeat an invalid openRewrite specification.
          For decision REWRITE, openRewrite.recipeKind MUST be exactly one of CHANGE_METHOD_NAME, INLINE_METHOD_CALLS, CUSTOM_JAVA_TEMPLATE.
          CHANGE_METHOD_NAME requires a valid OpenRewrite methodPattern and non-null newMethodName.
          INLINE_METHOD_CALLS requires a valid methodPattern and a non-empty replacement expression/template.
          CUSTOM_JAVA_TEMPLATE requires a valid methodPattern and a non-empty replacement expression/template.
          Never use recipeKind NONE for REWRITE.
          A methodPattern must use OpenRewrite MethodMatcher syntax, e.g. 'org.hibernate.Session createCriteria(java.lang.Class)'.
          replacement must be directly usable by the generated recipe and use #{p0}, #{p1}, ... for original invocation arguments when applicable.
          If the prior high-level solution cannot be represented by the selected recipe kind, revise the solution and choose CUSTOM_JAVA_TEMPLATE with the most concrete invocation-level replacement that advances the source to the target API.
          Do not return decisions for impactIds not supplied in this repair request.
          """.strip()

          for index, offset in enumerate(range(0, len(invalid), batch_size), start=1):
              items = invalid[offset:offset + batch_size]
              batch_impacts = []
              repair_context = []
              for item in items:
                  impact_id = item["impactId"]
                  batch_impacts.append(impact_by_id[impact_id])
                  repair_context.append({
                      "impactId": impact_id,
                      "validationErrors": item.get("errors", []),
                      "previousDecision": previous_by_id.get(impact_id),
                  })
              batch_evidence = dict(evidence)
              batch_evidence["impactCount"] = len(batch_impacts)
              batch_evidence["impacts"] = batch_impacts
              batch_evidence["repairContext"] = repair_context

              request = {
                  "model": os.environ["MODEL"],
                  "store": False,
                  "reasoning": {"effort": os.environ["REASONING_EFFORT"]},
                  "max_output_tokens": int(os.environ["MAX_OUTPUT_TOKENS"]),
                  "input": [
                      {"role": "developer", "content": [{"type": "input_text", "text": repair_instructions}]},
                      {"role": "user", "content": [{"type": "input_text", "text": "Repair evidence JSON follows.\n" + json.dumps(batch_evidence, sort_keys=True)}]},
                  ],
                  "text": {"format": {"type": "json_schema", "name": "dependency_migration_plan_repair", "strict": True, "schema": schema}},
              }
              stem = f"batch-{index:03d}"
              request_path = repair_root / f"{stem}-request.json"
              request_path.write_text(json.dumps(request, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              manifest["batches"].append({"batch": index, "impactIds": [i["impactId"] for i in batch_impacts]})

          manifest["batchCount"] = len(manifest["batches"])
          (repair_root / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

            repair_root="${OUTPUT_DIR}/groq-repairs/round-$(printf '%02d' "${round}")"
            batch_count="$(jq -r '.batchCount' "${repair_root}/manifest.json")"

            for batch in $(seq 1 "${batch_count}"); do
              stem="$(printf 'batch-%03d' "${batch}")"
              request_file="${repair_root}/${stem}-request.json"
              response_file="${repair_root}/${stem}-response.json"
              headers_file="${repair_root}/${stem}-headers.txt"
              raw_file="${repair_root}/${stem}-raw-plan.json"

              attempt=1
              while true; do
                : > "${headers_file}"
                http_code="$(curl \
                  --silent \
                  --show-error \
                  --connect-timeout 20 \
                  --max-time 300 \
                  --output "${response_file}" \
                  --dump-header "${headers_file}" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer ${GROQ_API_KEY}" \
                  --header 'Content-Type: application/json' \
                  --data-binary "@${request_file}" \
                  https://api.groq.com/openai/v1/responses)"

                if [[ "${http_code}" == "200" ]]; then
                  break
                fi

                error_message="$(jq -r '.error.message // .error // "unknown Groq API error"' "${response_file}" 2>/dev/null || true)"
                if [[ "${http_code}" == "429" && "${attempt}" -le "${MAX_RATE_LIMIT_RETRIES}" ]]; then
                  retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\\r", "", $2); print $2}' "${headers_file}" | tail -1)"
                  if [[ ! "${retry_after}" =~ ^[0-9]+$ ]]; then retry_after=15; fi
                  echo "Groq rate limit during repair ${round}/${stem}; retrying in ${retry_after}s."
                  sleep "${retry_after}"
                  attempt=$((attempt + 1))
                  continue
                fi
                echo "::error::Groq repair request returned HTTP ${http_code}: ${error_message}"
                exit 1
              done

              jq -r '[.output[]? | select(.type == "message") | .content[]? | select(.type == "output_text") | .text] | join("")' \
                "${response_file}" > "${raw_file}"
              jq -e . "${raw_file}" >/dev/null
            done

            ROUND="${round}" python3 <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          round_no = int(os.environ["ROUND"])
          raw_path = out / "ai-migration-plan-raw.json"
          combined = json.loads(raw_path.read_text(encoding="utf-8"))
          decisions = {d.get("impactId"): d for d in combined.get("decisions", []) if isinstance(d, dict) and d.get("impactId")}
          repair_root = out / "groq-repairs" / f"round-{round_no:02d}"
          manifest = json.loads((repair_root / "manifest.json").read_text(encoding="utf-8"))

          expected = set()
          replacements = {}
          for entry in manifest["batches"]:
              expected.update(entry["impactIds"])
              stem = f"batch-{entry['batch']:03d}"
              repaired = json.loads((repair_root / f"{stem}-raw-plan.json").read_text(encoding="utf-8"))
              for decision in repaired.get("decisions", []):
                  impact_id = decision.get("impactId")
                  if impact_id not in expected:
                      raise SystemExit(f"Repair response returned unexpected impactId {impact_id}")
                  if impact_id in replacements:
                      raise SystemExit(f"Repair response duplicated impactId {impact_id}")
                  replacements[impact_id] = decision

          missing = sorted(expected - set(replacements))
          if missing:
              raise SystemExit("Repair response missed impactIds: " + ", ".join(missing))

          decisions.update(replacements)
          combined["decisions"] = [decisions[k] for k in sorted(decisions)]
          combined["summary"] = (combined.get("summary") or "") + f" | repair round {round_no}: {len(replacements)} decision(s) corrected"
          raw_path.write_text(json.dumps(combined, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          done

          python3 "${PLANNER}" check \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --raw-plan "${OUTPUT_DIR}/ai-migration-plan-raw.json" \
            --report "${OUTPUT_DIR}/ai-migration-repair-check.json"

          if [[ "$(jq -r '.valid' "${OUTPUT_DIR}/ai-migration-repair-check.json")" != "true" ]]; then
            echo "::error::AI plan is still not machine-actionable after ${MAX_REPAIR_ROUNDS} targeted repair rounds."
            jq . "${OUTPUT_DIR}/ai-migration-repair-check.json"
            exit 1
          fi

      - name: Validate and enrich AI migration plan
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          python3 "${PLANNER}" validate \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --raw-plan "${OUTPUT_DIR}/ai-migration-plan-raw.json" \
            --output-dir "${OUTPUT_DIR}"

      - name: Create deterministic empty plan when no source impacts exist
        if: steps.build.outputs.needs_ai == 'false'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          python3 "${PLANNER}" empty-plan \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --output-dir "${OUTPUT_DIR}"

      - name: Create checksums and workflow summary
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          MODEL: ${{ env.GROQ_MODEL }}
        run: |
          set -euo pipefail

          if [[ -d "${OUTPUT_DIR}" ]]; then
            (
              cd "${OUTPUT_DIR}"
              find . -type f ! -name SHA256SUMS -print0 \
                | sort -z \
                | xargs -0 sha256sum \
                > SHA256SUMS
            )
          fi

          if [[ -s "${OUTPUT_DIR}/ai-migration-plan-summary.md" ]]; then
            cat "${OUTPUT_DIR}/ai-migration-plan-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

          {
            echo
            echo "## Planner execution"
            echo
            echo "- Model snapshot: \`${MODEL}\`"
            echo "- AI required: \`${{ steps.build.outputs.needs_ai }}\`"
            echo "- Planned impacts: \`${{ steps.build.outputs.impact_count }}\`"
            echo "- No source changes were applied."
            echo "- No OpenRewrite recipe was generated."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload AI migration plan
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ai-migration-plan-${{ steps.verify.outputs.pr_number }}-${{ steps.verify.outputs.head_sha }}
          path: ${{ runner.temp }}/ai-migration-plan
          if-no-files-found: error
          retention-days: 14
