name: PR 06 - AI migration plan

on:
  workflow_run:
    workflows:
      - "PR 05 - Map incompatible and removed Maven API usages"
    types:
      - completed
  workflow_dispatch:
    inputs:
      step5_run_id:
        description: "Successful Step-5 workflow run ID whose artifact should be analyzed"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-migration-plan-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.step5_run_id || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  COPILOT_MODEL: gpt-5.3-codex

jobs:
  plan-migration:
    name: Build validated AI migration plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       (github.event.workflow_run.actor.login == 'renovate[bot]' ||
        github.event.workflow_run.actor.login == github.repository_owner))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted pipeline code from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify Step 5 workflow run
        id: source_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.step5_run_id }}
          EXPECTED_WORKFLOW_NAME: PR 05 - Map incompatible and removed Maven API usages
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_id="${MANUAL_RUN_ID}"
          else
            run_id="${AUTOMATIC_RUN_ID}"
          fi

          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Step-5 workflow run ID: ${run_id}"
            exit 1
          fi

          response_file="${RUNNER_TEMP}/step5-workflow-run.json"
          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}")"

          if [[ "${http_code}" != "200" ]]; then
            echo "::error::Unable to read workflow run ${run_id}; GitHub API returned HTTP ${http_code}."
            cat "${response_file}" || true
            exit 1
          fi

          workflow_name="$(jq -r '.name // ""' "${response_file}")"
          conclusion="$(jq -r '.conclusion // ""' "${response_file}")"
          trigger_event="$(jq -r '.event // ""' "${response_file}")"
          head_sha="$(jq -r '.head_sha // ""' "${response_file}")"

          if [[ "${workflow_name}" != "${EXPECTED_WORKFLOW_NAME}" ]]; then
            echo "::error::Run ${run_id} belongs to workflow '${workflow_name}', expected '${EXPECTED_WORKFLOW_NAME}'."
            exit 1
          fi

          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::Step-5 run ${run_id} is not successful; conclusion=${conclusion}."
            exit 1
          fi

          if [[ "${trigger_event}" != "pull_request" ]]; then
            echo "::error::Step-5 run ${run_id} was not triggered by pull_request; event=${trigger_event}."
            exit 1
          fi

          if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Step-5 run ${run_id} returned an invalid head SHA: ${head_sha}"
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download Step 5 analysis artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-dependency-source-impact-*
          path: ${{ runner.temp }}/step5-artifact
          merge-multiple: true
          run-id: ${{ steps.source_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify trusted analysis input
        id: verify
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/step5-artifact
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ steps.source_run.outputs.head_sha }}
        run: |
          set -euo pipefail

          required_files=(
            metadata.json
            dependency-changes.json
            api-usage-summary.json
            api-usage-impact.json
            api-usages.jsonl
            api-changes.jsonl
            added-dependency-type-index.json
            removed-dependency-impact.json
            SHA256SUMS
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "${ARTIFACT_DIR}/${file}" ]]; then
              echo "::error::Required Step 5 artifact file missing or empty: ${file}"
              exit 1
            fi
          done

          actual_repository="$(jq -r '.repository' "${ARTIFACT_DIR}/metadata.json")"
          actual_head_sha="$(jq -r '.head.sha' "${ARTIFACT_DIR}/metadata.json")"
          pr_number="$(jq -r '.pullRequest' "${ARTIFACT_DIR}/metadata.json")"

          if [[ "${actual_repository}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "::error::Artifact repository mismatch: ${actual_repository}"
            exit 1
          fi

          if [[ "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Artifact HEAD SHA mismatch: artifact=${actual_head_sha}, workflow_run=${EXPECTED_HEAD_SHA}"
            exit 1
          fi

          (
            cd "${ARTIFACT_DIR}"
            sha256sum --check --strict SHA256SUMS
          )

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${actual_head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify migration planner implementation
        shell: bash
        env:
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          if [[ ! -s "${PLANNER}" ]]; then
            echo "::error::Migration planner script is missing: ${PLANNER}"
            exit 1
          fi

          python3 -m py_compile "${PLANNER}"
          sha256sum "${PLANNER}" | tee "${RUNNER_TEMP}/planner-sha256.txt"

      - name: Build deterministic AI input and candidate set
        id: build
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/step5-artifact
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          rm -rf -- "${OUTPUT_DIR}"
          mkdir -p -- "${OUTPUT_DIR}"

          result="$(python3 "${PLANNER}" build \
            --artifact-dir "${ARTIFACT_DIR}" \
            --output-dir "${OUTPUT_DIR}")"

          printf '%s\n' "${result}" | tee "${OUTPUT_DIR}/ai-migration-build-result.json"

          impact_count="$(printf '%s' "${result}" | jq -r '.impactCount')"
          needs_ai="$(printf '%s' "${result}" | jq -r '.needsAi')"

          echo "impact_count=${impact_count}" >> "${GITHUB_OUTPUT}"
          echo "needs_ai=${needs_ai}" >> "${GITHUB_OUTPUT}"

      - name: Attach exact PR source context
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 <<'PYSOURCE'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          path = out / "ai-migration-input.json"
          evidence = json.loads(path.read_text(encoding="utf-8"))
          repository = evidence["repository"]
          head_sha = evidence["headSha"]
          token = os.environ["GH_TOKEN"]

          source_files = sorted({
              usage.get("sourceFile")
              for impact in evidence.get("impacts", [])
              for usage in impact.get("usages", [])
              if usage.get("sourceFile")
          })
          if len(source_files) > 20:
              raise SystemExit(f"Refusing to attach more than 20 source files; found {len(source_files)}")

          contexts = []
          total_bytes = 0
          for source_file in source_files:
              encoded_path = urllib.parse.quote(source_file, safe="/")
              url = f"https://api.github.com/repos/{repository}/contents/{encoded_path}?ref={head_sha}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "renovate-ai-migration-planner",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except Exception as exc:
                  raise SystemExit(f"Unable to fetch exact PR source {source_file}@{head_sha}: {exc}")

              encoded = payload.get("content")
              if not isinstance(encoded, str):
                  raise SystemExit(f"GitHub contents API returned no inline content for {source_file}")
              content = base64.b64decode(encoded).decode("utf-8", errors="replace")
              raw_size = len(content.encode("utf-8"))
              if raw_size > 100_000:
                  raise SystemExit(f"Source context {source_file} exceeds 100 KB")
              total_bytes += raw_size
              if total_bytes > 400_000:
                  raise SystemExit("Combined source context exceeds 400 KB")
              contexts.append({"path": source_file, "sha": payload.get("sha", ""), "content": content})

          evidence["sourceContexts"] = contexts
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"Attached {len(contexts)} exact PR source file(s), {total_bytes} bytes")
          PYSOURCE

      - name: Set up Node.js for Copilot CLI
        if: steps.build.outputs.needs_ai == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version

      - name: Request AI migration plan with Copilot
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          MODEL: ${{ env.COPILOT_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          if [[ -z "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            echo "::error::Repository secret COPILOT_PAT is not configured. It must contain a fine-grained PAT with the Copilot Requests permission."
            exit 1
          fi

          python3 <<'PYPROMPT'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ["OUTPUT_DIR"])
          evidence = json.loads((out / "ai-migration-input.json").read_text(encoding="utf-8"))
          schema = json.loads((out / "ai-migration-output-schema.json").read_text(encoding="utf-8"))
          instructions = (out / "ai-migration-instructions.txt").read_text(encoding="utf-8").strip()
          prompt = (
              instructions
              + "\n\nIMPORTANT OUTPUT CONTRACT:\n"
              + "Return ONLY one JSON object. No Markdown fences, prose, explanations, or tool calls.\n"
              + "The JSON must conform exactly to this JSON Schema:\n"
              + json.dumps(schema, sort_keys=True)
              + "\n\nMigration evidence JSON follows:\n"
              + json.dumps(evidence, sort_keys=True)
              + "\n"
          )
          (out / "copilot-initial-prompt.txt").write_text(prompt, encoding="utf-8")
          PYPROMPT

          response_file="${OUTPUT_DIR}/copilot-initial-events.jsonl"
          stderr_file="${OUTPUT_DIR}/copilot-initial-stderr.txt"
          raw_file="${OUTPUT_DIR}/ai-migration-plan-raw.json"

          set +e
          copilot \
            -p "$(cat "${OUTPUT_DIR}/copilot-initial-prompt.txt")" \
            --model "${MODEL}" \
            --no-ask-user \
            --no-custom-instructions \
            --no-color \
            --no-auto-update \
            --output-format=json \
            > "${response_file}" 2> "${stderr_file}"
          copilot_exit=$?
          set -e

          echo "Copilot initial exit code: ${copilot_exit}"
          if [[ -s "${stderr_file}" ]]; then cat "${stderr_file}"; fi

          python3 - "${response_file}" "${raw_file}" "${copilot_exit}" <<'PYEXTRACT'
          import json
          import re
          import sys
          from pathlib import Path
          src, dst, cli_exit = Path(sys.argv[1]), Path(sys.argv[2]), int(sys.argv[3])
          messages = []
          if src.exists():
              for line in src.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      root = json.loads(line)
                  except Exception:
                      continue
                  stack = [root]
                  while stack:
                      cur = stack.pop()
                      if isinstance(cur, dict):
                          typ = str(cur.get("type", ""))
                          data = cur.get("data")
                          if "assistant.message" in typ and isinstance(data, dict):
                              content = data.get("content")
                              if isinstance(content, str) and content.strip():
                                  messages.append(content.strip())
                          stack.extend(cur.values())
                      elif isinstance(cur, list):
                          stack.extend(cur)
          if not messages:
              raise SystemExit(f"Copilot JSONL contained no assistant.message content (exit {cli_exit})")
          text = messages[-1]
          candidates = [text]
          candidates.extend(re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", text, flags=re.S | re.I))
          first, last = text.find("{"), text.rfind("}")
          if first >= 0 and last > first:
              candidates.append(text[first:last + 1])
          for candidate in candidates:
              try:
                  obj = json.loads(candidate)
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict):
                  dst.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")
                  print(f"Extracted migration plan from Copilot JSONL (CLI exit {cli_exit})")
                  break
          else:
              raise SystemExit("Copilot assistant.message did not contain valid JSON")
          PYEXTRACT

          python3 "${PLANNER}" normalize \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --raw-plan "${raw_file}"
          jq -e . "${raw_file}" >/dev/null

      - name: Validate initial plan and perform at most one Copilot repair request
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
          MODEL: ${{ env.COPILOT_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -euo pipefail

          check_file="${OUTPUT_DIR}/ai-migration-repair-check.json"
          raw_file="${OUTPUT_DIR}/ai-migration-plan-raw.json"
          python3 "${PLANNER}" check --input "${OUTPUT_DIR}/ai-migration-input.json" --raw-plan "${raw_file}" --report "${check_file}"

          if [[ "$(jq -r '.valid' "${check_file}")" == "true" ]]; then
            echo "Initial Copilot plan is machine-actionable; no repair request required."
            exit 0
          fi

          echo "Initial plan is invalid; issuing the single allowed whole-plan repair request."
          jq . "${check_file}"

          python3 <<'PYREPAIR'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ["OUTPUT_DIR"])
          evidence = json.loads((out / "ai-migration-input.json").read_text(encoding="utf-8"))
          schema = json.loads((out / "ai-migration-output-schema.json").read_text(encoding="utf-8"))
          instructions = (out / "ai-migration-instructions.txt").read_text(encoding="utf-8").strip()
          previous = json.loads((out / "ai-migration-plan-raw.json").read_text(encoding="utf-8"))
          validation = json.loads((out / "ai-migration-repair-check.json").read_text(encoding="utf-8"))
          prompt = (
              instructions
              + "\n\nREPAIR MODE - THIS IS THE ONLY REPAIR REQUEST.\n"
              + "Return a COMPLETE replacement plan for ALL impacts, not only the invalid ones.\n"
              + "Fix every validation error. Keep valid decisions and shared rewrite units where appropriate.\n"
              + "Re-evaluate rewrite granularity from sourceMethodGroups and exact source context. "
              + "If several affected APIs in one application method are semantically coupled, use one shared REPLACE_METHOD_BODY unit; "
              + "otherwise keep the smallest safe independent rewrite units.\n"
              + "Return ONLY one JSON object conforming exactly to this schema:\n"
              + json.dumps(schema, sort_keys=True)
              + "\n\nVALIDATION ERRORS:\n" + json.dumps(validation, sort_keys=True)
              + "\n\nPREVIOUS PLAN:\n" + json.dumps(previous, sort_keys=True)
              + "\n\nFULL MIGRATION EVIDENCE INCLUDING SOURCE CONTEXT:\n" + json.dumps(evidence, sort_keys=True)
              + "\n"
          )
          (out / "copilot-repair-prompt.txt").write_text(prompt, encoding="utf-8")
          PYREPAIR

          events="${OUTPUT_DIR}/copilot-repair-events.jsonl"
          stderr_file="${OUTPUT_DIR}/copilot-repair-stderr.txt"
          repaired="${OUTPUT_DIR}/copilot-repair-raw-plan.json"
          set +e
          copilot \
            -p "$(cat "${OUTPUT_DIR}/copilot-repair-prompt.txt")" \
            --model "${MODEL}" \
            --no-ask-user \
            --no-custom-instructions \
            --no-color \
            --no-auto-update \
            --output-format=json \
            > "${events}" 2> "${stderr_file}"
          copilot_exit=$?
          set -e
          echo "Copilot repair exit code: ${copilot_exit}"
          if [[ -s "${stderr_file}" ]]; then cat "${stderr_file}"; fi

          python3 - "${events}" "${repaired}" "${copilot_exit}" <<'PYEXTRACT'
          import json
          import re
          import sys
          from pathlib import Path
          src, dst, cli_exit = Path(sys.argv[1]), Path(sys.argv[2]), int(sys.argv[3])
          messages = []
          if src.exists():
              for line in src.read_text(encoding="utf-8", errors="replace").splitlines():
                  try:
                      root = json.loads(line)
                  except Exception:
                      continue
                  stack = [root]
                  while stack:
                      cur = stack.pop()
                      if isinstance(cur, dict):
                          if "assistant.message" in str(cur.get("type", "")) and isinstance(cur.get("data"), dict):
                              content = cur["data"].get("content")
                              if isinstance(content, str) and content.strip(): messages.append(content.strip())
                          stack.extend(cur.values())
                      elif isinstance(cur, list): stack.extend(cur)
          if not messages:
              raise SystemExit(f"Copilot repair JSONL contained no assistant.message content (exit {cli_exit})")
          text = messages[-1]
          candidates = [text]
          candidates.extend(re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", text, flags=re.S | re.I))
          first, last = text.find("{"), text.rfind("}")
          if first >= 0 and last > first: candidates.append(text[first:last + 1])
          for candidate in candidates:
              try: obj = json.loads(candidate)
              except json.JSONDecodeError: continue
              if isinstance(obj, dict):
                  dst.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")
                  break
          else:
              raise SystemExit("Copilot repair assistant.message did not contain valid JSON")
          PYEXTRACT

          cp "${repaired}" "${raw_file}"
          python3 "${PLANNER}" normalize --input "${OUTPUT_DIR}/ai-migration-input.json" --raw-plan "${raw_file}"
          python3 "${PLANNER}" check --input "${OUTPUT_DIR}/ai-migration-input.json" --raw-plan "${raw_file}" --report "${check_file}"

          if [[ "$(jq -r '.valid' "${check_file}")" != "true" ]]; then
            echo "::error::AI plan is still not machine-actionable after the single Copilot repair request."
            jq . "${check_file}"
            exit 1
          fi
          echo "AI plan is machine-actionable after one Copilot repair request."

      - name: Validate and enrich AI migration plan
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          python3 "${PLANNER}" validate \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --raw-plan "${OUTPUT_DIR}/ai-migration-plan-raw.json" \
            --output-dir "${OUTPUT_DIR}"

      - name: Create deterministic empty plan when no source impacts exist
        if: steps.build.outputs.needs_ai == 'false'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          python3 "${PLANNER}" empty-plan \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --output-dir "${OUTPUT_DIR}"

      - name: Create checksums and workflow summary
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          MODEL: ${{ env.COPILOT_MODEL }}
        run: |
          set -euo pipefail

          if [[ -d "${OUTPUT_DIR}" ]]; then
            (
              cd "${OUTPUT_DIR}"
              find . -type f ! -name SHA256SUMS -print0 \
                | sort -z \
                | xargs -0 sha256sum \
                > SHA256SUMS
            )
          fi

          if [[ -s "${OUTPUT_DIR}/ai-migration-plan-summary.md" ]]; then
            cat "${OUTPUT_DIR}/ai-migration-plan-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

          {
            echo
            echo "## Planner execution"
            echo
            echo "- Model snapshot: \`${MODEL}\`"
            echo "- AI required: \`${{ steps.build.outputs.needs_ai }}\`"
            echo "- Planned impacts: \`${{ steps.build.outputs.impact_count }}\`"
            echo "- No source changes were applied."
            echo "- No OpenRewrite recipe was generated."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload AI migration plan
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ai-migration-plan-${{ steps.verify.outputs.pr_number }}-${{ steps.verify.outputs.head_sha }}
          path: ${{ runner.temp }}/ai-migration-plan
          if-no-files-found: error
          retention-days: 14
