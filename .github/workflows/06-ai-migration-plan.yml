name: PR 06 - AI migration plan

on:
  workflow_run:
    workflows:
      - "PR 05 - Map incompatible and removed Maven API usages"
    types:
      - completed
  workflow_dispatch:
    inputs:
      step5_run_id:
        description: "Successful Step-5 workflow run ID whose artifact should be analyzed"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-migration-plan-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.step5_run_id || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  COPILOT_MODEL: gpt-5.3-codex

jobs:
  plan-migration:
    name: Build validated AI migration plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       (github.event.workflow_run.actor.login == 'renovate[bot]' ||
        github.event.workflow_run.actor.login == github.repository_owner))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted pipeline code from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve and verify Step 5 workflow run
        id: source_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.step5_run_id }}
          EXPECTED_WORKFLOW_NAME: PR 05 - Map incompatible and removed Maven API usages
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_id="${MANUAL_RUN_ID}"
          else
            run_id="${AUTOMATIC_RUN_ID}"
          fi

          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Step-5 workflow run ID: ${run_id}"
            exit 1
          fi

          response_file="${RUNNER_TEMP}/step5-workflow-run.json"
          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}")"

          if [[ "${http_code}" != "200" ]]; then
            echo "::error::Unable to read workflow run ${run_id}; GitHub API returned HTTP ${http_code}."
            cat "${response_file}" || true
            exit 1
          fi

          workflow_name="$(jq -r '.name // ""' "${response_file}")"
          conclusion="$(jq -r '.conclusion // ""' "${response_file}")"
          trigger_event="$(jq -r '.event // ""' "${response_file}")"
          head_sha="$(jq -r '.head_sha // ""' "${response_file}")"

          if [[ "${workflow_name}" != "${EXPECTED_WORKFLOW_NAME}" ]]; then
            echo "::error::Run ${run_id} belongs to workflow '${workflow_name}', expected '${EXPECTED_WORKFLOW_NAME}'."
            exit 1
          fi

          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::Step-5 run ${run_id} is not successful; conclusion=${conclusion}."
            exit 1
          fi

          if [[ "${trigger_event}" != "pull_request" ]]; then
            echo "::error::Step-5 run ${run_id} was not triggered by pull_request; event=${trigger_event}."
            exit 1
          fi

          if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Step-5 run ${run_id} returned an invalid head SHA: ${head_sha}"
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download Step 5 analysis artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-dependency-source-impact-*
          path: ${{ runner.temp }}/step5-artifact
          merge-multiple: true
          run-id: ${{ steps.source_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify trusted analysis input
        id: verify
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/step5-artifact
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ steps.source_run.outputs.head_sha }}
        run: |
          set -euo pipefail

          required_files=(
            metadata.json
            dependency-changes.json
            api-usage-summary.json
            api-usage-impact.json
            api-usages.jsonl
            api-changes.jsonl
            added-dependency-type-index.json
            removed-dependency-impact.json
            SHA256SUMS
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "${ARTIFACT_DIR}/${file}" ]]; then
              echo "::error::Required Step 5 artifact file missing or empty: ${file}"
              exit 1
            fi
          done

          actual_repository="$(jq -r '.repository' "${ARTIFACT_DIR}/metadata.json")"
          actual_head_sha="$(jq -r '.head.sha' "${ARTIFACT_DIR}/metadata.json")"
          pr_number="$(jq -r '.pullRequest' "${ARTIFACT_DIR}/metadata.json")"

          if [[ "${actual_repository}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "::error::Artifact repository mismatch: ${actual_repository}"
            exit 1
          fi

          if [[ "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Artifact HEAD SHA mismatch: artifact=${actual_head_sha}, workflow_run=${EXPECTED_HEAD_SHA}"
            exit 1
          fi

          (
            cd "${ARTIFACT_DIR}"
            sha256sum --check --strict SHA256SUMS
          )

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${actual_head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify migration planner implementation
        shell: bash
        env:
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          if [[ ! -s "${PLANNER}" ]]; then
            echo "::error::Migration planner script is missing: ${PLANNER}"
            exit 1
          fi

          python3 -m py_compile "${PLANNER}"
          sha256sum "${PLANNER}" | tee "${RUNNER_TEMP}/planner-sha256.txt"

      - name: Build deterministic AI input and candidate set
        id: build
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/step5-artifact
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          rm -rf -- "${OUTPUT_DIR}"
          mkdir -p -- "${OUTPUT_DIR}"

          result="$(python3 "${PLANNER}" build \
            --artifact-dir "${ARTIFACT_DIR}" \
            --output-dir "${OUTPUT_DIR}")"

          printf '%s\n' "${result}" | tee "${OUTPUT_DIR}/ai-migration-build-result.json"

          impact_count="$(printf '%s' "${result}" | jq -r '.impactCount')"
          needs_ai="$(printf '%s' "${result}" | jq -r '.needsAi')"

          echo "impact_count=${impact_count}" >> "${GITHUB_OUTPUT}"
          echo "needs_ai=${needs_ai}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js for Copilot CLI
        if: steps.build.outputs.needs_ai == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version

      - name: Request AI migration plan with Copilot
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          MODEL: ${{ env.COPILOT_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -euo pipefail

          if [[ -z "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            echo "::error::Repository secret COPILOT_PAT is not configured. It must contain a fine-grained PAT with the Copilot Requests permission."
            exit 1
          fi

          python3 <<'PYPROMPT'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          evidence = json.loads((out / "ai-migration-input.json").read_text(encoding="utf-8"))
          schema = json.loads((out / "ai-migration-output-schema.json").read_text(encoding="utf-8"))
          instructions = (out / "ai-migration-instructions.txt").read_text(encoding="utf-8").strip()

          prompt = f"""{instructions}

          IMPORTANT OUTPUT CONTRACT:
          Return ONLY one JSON object. Do not use Markdown fences, prose, explanations, or tool calls.
          The JSON must conform exactly to this JSON Schema:
          {json.dumps(schema, sort_keys=True)}

          Return exactly one decision for every supplied impactId and no others.
          Migration evidence JSON follows:
          {json.dumps(evidence, sort_keys=True)}
          """
          (out / "copilot-initial-prompt.txt").write_text(prompt, encoding="utf-8")
          PYPROMPT

          response_file="${OUTPUT_DIR}/copilot-initial-response.txt"
          raw_file="${OUTPUT_DIR}/ai-migration-plan-raw.json"

          copilot \
            -p "$(cat "${OUTPUT_DIR}/copilot-initial-prompt.txt")" \
            -s \
            --model "${MODEL}" \
            --no-ask-user \
            --no-custom-instructions \
            --no-color \
            --stream off \
            > "${response_file}"

          python3 - "${response_file}" "${raw_file}" <<'PYEXTRACT'
          import json
          import re
          import sys
          from pathlib import Path

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          text = src.read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit("Copilot returned an empty response")

          candidates = [text]
          fenced = re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", text, flags=re.S | re.I)
          candidates.extend(fenced)
          first = text.find("{")
          last = text.rfind("}")
          if first >= 0 and last > first:
              candidates.append(text[first:last + 1])

          for candidate in candidates:
              try:
                  obj = json.loads(candidate)
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict):
                  dst.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")
                  break
          else:
              raise SystemExit("Copilot response did not contain a valid JSON object")
          PYEXTRACT

          jq -e . "${raw_file}" >/dev/null

      - name: Validate initial plan and perform at most one Copilot repair request
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
          MODEL: ${{ env.COPILOT_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -euo pipefail

          check_file="${OUTPUT_DIR}/ai-migration-repair-check.json"
          python3 "${PLANNER}" check \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --raw-plan "${OUTPUT_DIR}/ai-migration-plan-raw.json" \
            --report "${check_file}"

          if [[ "$(jq -r '.valid' "${check_file}")" == "true" ]]; then
            echo "Initial Copilot plan is machine-actionable; no repair request required."
            exit 0
          fi

          if [[ "$(jq '.globalErrors | length' "${check_file}")" -gt 0 ]]; then
            echo "::error::Initial Copilot plan has global structural errors; refusing an exploratory retry."
            jq . "${check_file}"
            exit 1
          fi

          invalid_count="$(jq '.invalidImpacts | length' "${check_file}")"
          if [[ "${invalid_count}" -eq 0 ]]; then
            echo "::error::Initial Copilot plan is invalid but contains no repairable impacts."
            jq . "${check_file}"
            exit 1
          fi

          echo "Initial plan has ${invalid_count} invalid impact(s); issuing the single allowed Copilot repair request."

          python3 <<'PYREPAIR'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          evidence = json.loads((out / "ai-migration-input.json").read_text(encoding="utf-8"))
          schema = json.loads((out / "ai-migration-output-schema.json").read_text(encoding="utf-8"))
          base_instructions = (out / "ai-migration-instructions.txt").read_text(encoding="utf-8").strip()
          check = json.loads((out / "ai-migration-repair-check.json").read_text(encoding="utf-8"))
          raw_plan = json.loads((out / "ai-migration-plan-raw.json").read_text(encoding="utf-8"))

          impact_by_id = {i["impactId"]: i for i in evidence.get("impacts", [])}
          previous_by_id = {
              d.get("impactId"): d for d in raw_plan.get("decisions", [])
              if isinstance(d, dict) and d.get("impactId")
          }
          invalid = check.get("invalidImpacts", [])
          invalid_ids = [item["impactId"] for item in invalid]

          repair_evidence = dict(evidence)
          repair_evidence["impactCount"] = len(invalid_ids)
          repair_evidence["impacts"] = [impact_by_id[i] for i in invalid_ids]
          repair_evidence["repairContext"] = [
              {
                  "impactId": item["impactId"],
                  "validationErrors": item.get("errors", []),
                  "previousDecision": previous_by_id.get(item["impactId"]),
              }
              for item in invalid
          ]

          prompt = f"""{base_instructions}

          REPAIR MODE - THIS IS THE ONLY REPAIR REQUEST:
          Return ONLY one JSON object, with no Markdown or prose.
          Return one corrected decision for EVERY supplied impactId and for NO OTHER impactId.
          Fix EVERY validationErrors entry. Preserve valid parts of the previous decision where useful.
          The result must pass machine validation without another AI call.
          For REWRITE, recipeKind must be CHANGE_METHOD_NAME, INLINE_METHOD_CALLS, or CUSTOM_JAVA_TEMPLATE.
          CHANGE_METHOD_NAME requires methodPattern and newMethodName.
          INLINE_METHOD_CALLS and CUSTOM_JAVA_TEMPLATE require methodPattern and replacement.
          Never use recipeKind NONE for REWRITE.
          Method patterns use OpenRewrite MethodMatcher syntax, for example 'org.hibernate.Session createCriteria(java.lang.Class)'.
          Placeholder arity is strict: () allows no #{{pN}}; (A) allows only #{{p0}}; (A,B) allows only #{{p0}} and #{{p1}}.
          For exact evidence-backed javax.* -> jakarta.* replacements, use the supplied jakarta candidate and never an unrelated same-simple-name type.

          The JSON must conform exactly to this JSON Schema:
          {json.dumps(schema, sort_keys=True)}

          Repair evidence JSON follows:
          {json.dumps(repair_evidence, sort_keys=True)}
          """
          (out / "copilot-repair-prompt.txt").write_text(prompt, encoding="utf-8")
          PYREPAIR

          response_file="${OUTPUT_DIR}/copilot-repair-response.txt"
          repaired_file="${OUTPUT_DIR}/copilot-repair-raw-plan.json"

          copilot \
            -p "$(cat "${OUTPUT_DIR}/copilot-repair-prompt.txt")" \
            -s \
            --model "${MODEL}" \
            --no-ask-user \
            --no-custom-instructions \
            --no-color \
            --stream off \
            > "${response_file}"

          python3 - "${response_file}" "${repaired_file}" <<'PYEXTRACT'
          import json
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          dst = Path(sys.argv[2])
          candidates = [text]
          candidates.extend(re.findall(r"```(?:json)?\s*(\{.*?\})\s*```", text, flags=re.S | re.I))
          first = text.find("{")
          last = text.rfind("}")
          if first >= 0 and last > first:
              candidates.append(text[first:last + 1])
          for candidate in candidates:
              try:
                  obj = json.loads(candidate)
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict):
                  dst.write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")
                  break
          else:
              raise SystemExit("Copilot repair response did not contain a valid JSON object")
          PYEXTRACT

          python3 <<'PYMERGE'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUTPUT_DIR"])
          raw_path = out / "ai-migration-plan-raw.json"
          combined = json.loads(raw_path.read_text(encoding="utf-8"))
          check = json.loads((out / "ai-migration-repair-check.json").read_text(encoding="utf-8"))
          repaired = json.loads((out / "copilot-repair-raw-plan.json").read_text(encoding="utf-8"))

          expected = {item["impactId"] for item in check.get("invalidImpacts", [])}
          replacements = {}
          for decision in repaired.get("decisions", []):
              impact_id = decision.get("impactId")
              if impact_id not in expected:
                  raise SystemExit(f"Repair response returned unexpected impactId {impact_id}")
              if impact_id in replacements:
                  raise SystemExit(f"Repair response duplicated impactId {impact_id}")
              replacements[impact_id] = decision

          missing = sorted(expected - set(replacements))
          if missing:
              raise SystemExit("Repair response missed impactIds: " + ", ".join(missing))

          decisions = {
              d.get("impactId"): d for d in combined.get("decisions", [])
              if isinstance(d, dict) and d.get("impactId")
          }
          decisions.update(replacements)
          combined["decisions"] = [decisions[k] for k in sorted(decisions)]
          combined["summary"] = (combined.get("summary") or "") + f" | single Copilot repair: {len(replacements)} decision(s) corrected"
          raw_path.write_text(json.dumps(combined, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYMERGE

          python3 "${PLANNER}" check \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --raw-plan "${OUTPUT_DIR}/ai-migration-plan-raw.json" \
            --report "${check_file}"

          if [[ "$(jq -r '.valid' "${check_file}")" != "true" ]]; then
            echo "::error::AI plan is still not machine-actionable after the single Copilot repair request."
            jq . "${check_file}"
            exit 1
          fi

          echo "AI plan is machine-actionable after one Copilot repair request."

      - name: Validate and enrich AI migration plan
        if: steps.build.outputs.needs_ai == 'true'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          python3 "${PLANNER}" validate \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --raw-plan "${OUTPUT_DIR}/ai-migration-plan-raw.json" \
            --output-dir "${OUTPUT_DIR}"

      - name: Create deterministic empty plan when no source impacts exist
        if: steps.build.outputs.needs_ai == 'false'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          PLANNER: .github/scripts/ai-migration-planner.py
        run: |
          set -euo pipefail

          python3 "${PLANNER}" empty-plan \
            --input "${OUTPUT_DIR}/ai-migration-input.json" \
            --output-dir "${OUTPUT_DIR}"

      - name: Create checksums and workflow summary
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/ai-migration-plan
          MODEL: ${{ env.COPILOT_MODEL }}
        run: |
          set -euo pipefail

          if [[ -d "${OUTPUT_DIR}" ]]; then
            (
              cd "${OUTPUT_DIR}"
              find . -type f ! -name SHA256SUMS -print0 \
                | sort -z \
                | xargs -0 sha256sum \
                > SHA256SUMS
            )
          fi

          if [[ -s "${OUTPUT_DIR}/ai-migration-plan-summary.md" ]]; then
            cat "${OUTPUT_DIR}/ai-migration-plan-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

          {
            echo
            echo "## Planner execution"
            echo
            echo "- Model snapshot: \`${MODEL}\`"
            echo "- AI required: \`${{ steps.build.outputs.needs_ai }}\`"
            echo "- Planned impacts: \`${{ steps.build.outputs.impact_count }}\`"
            echo "- No source changes were applied."
            echo "- No OpenRewrite recipe was generated."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload AI migration plan
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ai-migration-plan-${{ steps.verify.outputs.pr_number }}-${{ steps.verify.outputs.head_sha }}
          path: ${{ runner.temp }}/ai-migration-plan
          if-no-files-found: error
          retention-days: 14
